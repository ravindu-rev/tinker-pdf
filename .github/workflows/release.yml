# A merge to `main` releases: one version, four artefacts.
#
# Every push to `main` — the owner's merge of `develop` — runs CI's tests
# first (`ci.yml`, called), then asks one question: does the workspace
# version have a `v<version>` tag yet? If it does, that version is released
# and the run stops there. If it does not, every artefact is built and
# checked — the crates packaged and verified against each other, an abi3
# wheel per platform, the npm package, the NuGet package with three native
# libraries, the browser demo — and then published: the crates to crates.io
# in dependency order, the wheels to PyPI, the package to npm and to NuGet,
# and last the tag and a GitHub release. So a merge that does not change the
# version releases nothing, and the version is the switch.
#
# Publishing is resumable: crates.io's "already uploaded" counts as a step
# done (`cargo xtask release`), the wheels and the NuGet package are pushed
# with their tools' skip-existing flags, the npm package is published only
# when its version is not on npm, and the tag is written only after all four
# registries have the version, so a run that fails part-way is finished by
# the next push to `main` or a re-run.
#
# ## The hazard this file is written against
#
# `cargo test` with a filter matching nothing prints `0 passed` and exits 0. A
# release job is the same hazard with worse consequences: a job that builds
# nothing, uploads nothing and reports success is indistinguishable from one
# that worked, and the thing it is claiming is precisely that four artefacts
# exist.
#
# So every artefact job ends by asserting the artefact is there and is the
# right shape -- an abi3 tag in the wheel's filename, a `.wasm` in the npm
# tarball, a `runtimes/<rid>/native/` entry in the `.nupkg` -- and a final job
# collects all four and fails unless it can count them. `if-no-files-found:
# error` on every upload, because the default is `warn`, which is a green tick.
name: Release

on:
  push:
    branches: [main]

# Two merges in quick succession release one after the other, never at once.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The unit and integration tests, exactly as a pull request runs them.
  tests:
    uses: ./.github/workflows/ci.yml

  # Whether there is anything to release, and nothing built until the
  # manifests agree about the version: `cargo xtask check`, which holds every
  # manifest to the workspace version, and the release plan held to the tag
  # the version names. The cheapest job in the file: a mismatch found here
  # costs a minute, and found after the wheel matrix costs a release.
  preflight:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Every tag, so the question below is answered from the repository.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- check
      - name: The workspace version, and whether it is released
        id: version
        run: |
          set -o pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "tinker-pdf") | .version')
          test -n "$version" || { echo "::error::no tinker-pdf version in the workspace"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "v$version is tagged, so it is released: nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is not tagged: releasing it"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: The version and its tag are the same number
        if: steps.version.outputs.release == 'true'
        run: cargo run -p xtask -- release --plan --tag "v${{ steps.version.outputs.version }}"

  # The fifteen crates, packaged and *verified*, against each other rather
  # than against crates.io.
  #
  # This is the half of the pipeline that had never run. `cargo publish
  # --dry-run` resolves against the live index, and nothing of this name has
  # ever been published there, so ten of the fifteen crates failed with `no
  # matching package named tinker-pdf-crypto` — which reads exactly like a
  # broken manifest and is not one. Only the five leaves were ever exercised.
  #
  # `--local-registry` patches each crate's registry dependencies at the
  # unpacked `.crate` archives the earlier steps left in `target/package/`, so
  # every crate is verified against the same bytes its dependents would
  # download. See `local_registry_dry_run` for why the patch set is "everything
  # published before this one" rather than either narrower or wider.
  crates:
    needs: preflight
    if: needs.preflight.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package and verify every crate against the ones before it
        run: |
          set -o pipefail
          cargo run -p xtask -- release --local-registry --only crates \
            2>&1 | tee crates.log
          # The hazard this whole file is written against: a job that built
          # nothing and reported success. `--only crates` with a broken plan
          # would run zero steps and exit 0, which is indistinguishable from
          # fifteen passing.
          grep -Eq 'release: 1[5-9] step\(s\) ran' crates.log
          # And nothing may be left unproved, which is the entire point of
          # the flag: without it this number is ten.
          grep -q 'release: .*0 unprovable without publishing' crates.log

  # Plan 26 milestone 3: one wheel per platform, not one per interpreter.
  #
  # `bindings/python/Cargo.toml` asks pyo3 for `abi3-py39`, which is what makes
  # maturin emit a single `cp39-abi3` wheel that pip installs on every CPython
  # from 3.9 up. That was already true and had never been built; what is new is
  # that it is built, installed and *rendered through* on three platforms.
  wheels:
    needs: preflight
    if: needs.preflight.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: 'off'
          - os: macos-14
            target: aarch64-apple-darwin
            manylinux: 'off'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          # The *build* interpreter. It is deliberately not the floor: an abi3
          # wheel built by 3.12 must install on 3.9, and building with 3.9
          # would let a wheel that is secretly version-specific pass.
          python-version: '3.12'
      - name: Build an abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --manifest-path bindings/python/Cargo.toml --out dist
      # The whole point of the milestone, asserted rather than assumed. Without
      # this the job passes on a per-interpreter wheel, which is what the gap
      # plan says is wrong with the status quo.
      - name: The wheel is abi3, and there is exactly one
        shell: bash
        run: |
          set -o pipefail
          ls -l dist/
          count=$(ls dist/*.whl | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::$count wheels; an abi3 build produces one per platform"
            exit 1
          fi
          name=$(basename dist/*.whl)
          case "$name" in
            *-abi3-*) echo "abi3 wheel: $name" ;;
            *) echo "::error::$name is not an abi3 wheel, so it covers one interpreter"; exit 1 ;;
          esac
      - name: A face to draw with
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      # Installed and rendered through on an interpreter that is NOT the one
      # that built it, which is the claim "one wheel per platform" makes.
      - name: Install on 3.9 and 3.13 and render
        shell: bash
        run: |
          set -o pipefail
          for version in 3.9 3.13; do
            echo "::group::CPython $version"
            python -m pip install --quiet --upgrade uv || true
            uv venv --python "$version" ".venv$version"
            if [ -d ".venv$version/Scripts" ]; then
              py=".venv$version/Scripts/python.exe"
            else
              py=".venv$version/bin/python"
            fi
            "$py" -m ensurepip --upgrade
            "$py" -m pip install --quiet dist/*.whl
            "$py" bindings/python/tests/wheel_smoke.py \
              testdata/simple-text.pdf auto 2>&1 | tee "smoke$version.log"
            grep -q 'WHEEL-SMOKE: RAN' "smoke$version.log"
            # The write leg (gap 32). A package that shipped a read-only
            # engine would pass every line above and fail here, which is the
            # point of running it inside the release pipeline rather than
            # only in CI.
            "$py" bindings/python/tests/write_parity.py \
              testdata/form-fields.pdf 2>&1 | tee "write$version.log"
            grep -q 'PYTHON-PARITY: RAN' "write$version.log"
            grep -q 'WROTE sha256=' "write$version.log"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          # The default is `warn`, and a warning is a green tick.
          if-no-files-found: error

  # Plan 26 milestone 4. One artefact, not a matrix: wasm32-unknown-unknown is
  # the same code generation everywhere, and the determinism leg (ruling 4,
  # gap 25) is what says so.
  npm:
    needs: preflight
    if: needs.preflight.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
      - run: wasm-pack build --release --target web --out-dir pkg bindings/js
      # Plan 13's budget, and it is a gate rather than a report: the whole
      # argument for externalising the substitute font programs was that a
      # browser should not pay for what it does not use.
      - name: Under plan 13's 2.5 MB gzipped budget
        run: |
          set -o pipefail
          bytes=$(gzip -9 -c bindings/js/pkg/tinker_pdf_js_bg.wasm | wc -c)
          budget=$((5 * 1024 * 1024 / 2))
          echo "wasm is $bytes bytes gzipped, budget is $budget"
          if [ "$bytes" -gt "$budget" ]; then
            echo "::error::the wasm is $bytes bytes gzipped, over plan 13's $budget"
            exit 1
          fi
      # `npm install` of a real tarball, not a link to the build directory:
      # the tarball is what a user gets, and its `files` list is a thing that
      # can be wrong. It has been -- the licence text was dropped from it,
      # because npm force-includes a file called LICENSE and not one called
      # LICENSE-MIT.
      - name: Pack, install and render in Node
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/npm-consumer"
          tarball=$(cd bindings/js/pkg && npm pack --pack-destination "$RUNNER_TEMP/npm-consumer" | tail -1)
          cd "$RUNNER_TEMP/npm-consumer"
          npm init -y > /dev/null
          npm pkg set type=module > /dev/null
          npm install "./$tarball"
          test -f node_modules/tinker-pdf-js/LICENSE \
            || { echo "::error::the package ships no licence text"; exit 1; }
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          node "$GITHUB_WORKSPACE/bindings/js/tests/node_smoke.mjs" \
            "$GITHUB_WORKSPACE/testdata/simple-text.pdf" \
            /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf 2>&1 | tee node-smoke.log
          grep -q 'NODE-SMOKE: RAN' node-smoke.log
          # The write leg (gap 32), from the same installed package.
          node "$GITHUB_WORKSPACE/bindings/js/tests/write_parity.mjs" \
            "$GITHUB_WORKSPACE/testdata/form-fields.pdf" 2>&1 | tee js-write.log
          grep -q 'JS-PARITY: RAN' js-write.log
          grep -q 'WROTE sha256=' js-write.log
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: bindings/js/pkg/
          if-no-files-found: error

  # Plan 26 milestone 5, first half: one cdylib per RID. A NuGet package
  # carries platform binaries as `runtimes/<rid>/native/`, and no single
  # machine can build more than its own — so the libraries are built on the
  # matrix and gathered by the job below.
  natives:
    needs: preflight
    if: needs.preflight.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-14
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p tinker-pdf-ffi
      # `cargo xtask nuget-stage` reads this machine's OS and architecture and
      # puts the library where NuGet expects it. Doing it in xtask rather than
      # in three `cp` lines here is what makes the RID mapping testable, and
      # the mapping is the part that can be wrong: a package built with the
      # wrong RID restores perfectly and throws DllNotFoundException on first
      # use.
      - run: cargo run -p xtask -- nuget-stage
      - name: The library is where the RID says
        shell: bash
        run: |
          test -n "$(ls bindings/dotnet/runtimes/${{ matrix.rid }}/native/)" \
            || { echo "::error::nothing under runtimes/${{ matrix.rid }}/native/"; exit 1; }
          ls -l bindings/dotnet/runtimes/${{ matrix.rid }}/native/
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: bindings/dotnet/runtimes/${{ matrix.rid }}/native/*
          if-no-files-found: error

  # Plan 26 milestone 5, second half: one package carrying all three.
  nuget:
    needs: [preflight, natives]
    if: needs.preflight.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: natives
      - name: Gather every RID into the layout
        shell: bash
        run: |
          set -o pipefail
          for dir in natives/native-*; do
            rid="${dir#natives/native-}"
            mkdir -p "bindings/dotnet/runtimes/$rid/native"
            cp "$dir"/* "bindings/dotnet/runtimes/$rid/native/"
          done
          find bindings/dotnet/runtimes -type f | sort
          count=$(find bindings/dotnet/runtimes -type f | wc -l)
          if [ "$count" -ne 3 ]; then
            echo "::error::$count native libraries, expected 3 (linux-x64, win-x64, osx-arm64)"
            exit 1
          fi
      - run: dotnet pack bindings/dotnet/TinkerPdf.csproj -c Release -o target/nuget
      # Without this the job passes on a managed-only package, which is exactly
      # what `dotnet pack` produced before `runtimes/` existed: it restores, it
      # compiles, and every call throws at run time on the consumer's machine.
      - name: The package carries all three natives
        shell: bash
        run: |
          set -o pipefail
          unzip -l target/nuget/TinkerPdf.*.nupkg | tee nupkg.log
          for rid in linux-x64 win-x64 osx-arm64; do
            grep -q "runtimes/$rid/native/" nupkg.log \
              || { echo "::error::no native library for $rid in the package"; exit 1; }
          done
      # `dotnet add package` from a folder feed, then a render. The smoke
      # project consumes the package rather than the project on purpose: a
      # ProjectReference finds the cdylib wherever cargo left it and would
      # pass on a package that carries none.
      - name: Install the package and render
        shell: bash
        run: |
          set -o pipefail
          # The third argument is the write leg's fixture (gap 32): the same
          # program does both, so a package that shipped a read-only engine
          # fails its own release pipeline rather than passing it.
          dotnet run --project bindings/dotnet/tests/Smoke -c Release -- \
            testdata/simple-text.pdf C:/Windows/Fonts/arial.ttf \
            testdata/form-fields.pdf 2>&1 | tee dotnet-smoke.log
          grep -q 'DOTNET-SMOKE: RAN' dotnet-smoke.log
          grep -q 'DOTNET-PARITY: RAN' dotnet-smoke.log
          grep -q 'DOTNET-SMOKE: WROTE sha256=' dotnet-smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: target/nuget/*.nupkg
          if-no-files-found: error

  # Plan 13's exit criterion for the JavaScript binding, executed: "a page that
  # renders an uploaded PDF". The Node smoke test cannot cover this — neither
  # the module fetching its own `.wasm` over HTTP nor the pixels reaching a
  # `<canvas>` exists outside a browser.
  demo:
    needs: preflight
    if: needs.preflight.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
      - run: wasm-pack build --release --target web --out-dir pkg bindings/js
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - name: Render an uploaded PDF in a real browser
        working-directory: bindings/js/demo
        run: |
          set -o pipefail
          npm install
          npx playwright install --with-deps chromium
          node verify.mjs ../../../testdata/simple-text.pdf \
            /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf 2>&1 | tee demo.log
          grep -q 'DEMO-RENDER: RAN' demo.log

  # Plan 26 milestone 6: **one release produces all four artefacts.**
  #
  # This job exists because the four above can each pass while producing
  # nothing anybody can install, and because a workflow with four green ticks
  # and no artefacts looks exactly like a working release. It downloads
  # everything and counts it. `wc -l` on a `find` is not elegant; it is the
  # assertion, and it is the only thing in this file that checks the claim the
  # milestone actually makes.
  artefacts:
    needs: [crates, wheels, npm, nuget, demo]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      - name: All four, counted
        run: |
          set -o pipefail
          find artefacts -type f | sort
          wheels=$(find artefacts -name '*.whl' | wc -l)
          wasm=$(find artefacts -name '*.wasm' | wc -l)
          nupkg=$(find artefacts -name '*.nupkg' | wc -l)
          abi3=$(find artefacts -name '*-abi3-*.whl' | wc -l)
          echo "wheels=$wheels (abi3=$abi3) wasm=$wasm nupkg=$nupkg"
          test "$wheels" -eq 3 || { echo "::error::$wheels wheels, expected 3"; exit 1; }
          test "$abi3"   -eq 3 || { echo "::error::$abi3 abi3 wheels, expected 3"; exit 1; }
          test "$wasm"   -eq 1 || { echo "::error::$wasm wasm files, expected 1"; exit 1; }
          test "$nupkg"  -eq 1 || { echo "::error::$nupkg nupkg files, expected 1"; exit 1; }
          echo "RELEASE-ARTEFACTS: ALL FOUR PRESENT"

  # The only job in this file that publishes, and only once every artefact
  # above is built, checked and counted. What it publishes is what those jobs
  # built and tested from this commit: the crates by `cargo xtask release`,
  # whose order, version check and "already uploaded" handling are tested
  # there rather than restated here; the three wheels, the npm package and the
  # NuGet package as the matrix made them, since no one machine builds every
  # platform's. The tag and the GitHub release come last, so a version is
  # tagged only once every registry has it.
  publish:
    needs: [preflight, artefacts]
    if: needs.preflight.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: registries
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      - name: The crates, to crates.io in dependency order, halting on the first failure
        run: cargo run -p xtask -- release --execute --only crates --tag "v$VERSION"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: The three wheels, to PyPI
        run: |
          python -m pip install --quiet maturin
          maturin upload --skip-existing artefacts/wheel-*/*.whl
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.MATURIN_PYPI_TOKEN }}
      - name: The wasm package, to npm
        working-directory: artefacts/npm-package
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          test "$version" = "$VERSION" \
            || { echo "::error::the npm package is $version, the workspace $VERSION"; exit 1; }
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is on npm already"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: The NuGet package, to NuGet
        run: |
          dotnet nuget push artefacts/nuget-package/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      - name: The tag, and a GitHub release carrying the wheels and the NuGet package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "tinker-pdf $VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
          gh release create "v$VERSION" \
            artefacts/wheel-*/*.whl artefacts/nuget-package/*.nupkg \
            --title "tinker-pdf $VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

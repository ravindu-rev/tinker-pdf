# tinker-pdf CI: the unit and integration tests, on every pull request.
#
# Only the tests run here. Everything else this repository checks — fmt,
# clippy and the rest of the gates (`tools/gates.py`), fuzzing, the corpus
# runs, the benches, peak memory, the wasm32-wasip1 fingerprints, the
# bindings' parity, the wasm footprint, the licences and the oracle suites —
# is run locally by whoever makes a change, as its proof, and recorded in the
# roadmap row it closes (`docs/verification.md`). A merge to `main` runs
# these tests again before it releases (`release.yml`).

name: CI

on:
  pull_request:
  # `release.yml` runs the same tests before it builds anything.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The hosted Linux image keeps toolchains this job never uses, and the
      # debug builds of the workspace and of the facade in its other two
      # feature sets outgrow the disk it leaves. Removed before anything is
      # built.
      - name: Free the disk the builds need
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # Per package rather than at the workspace root: `tools/` and
      # `tinker-pdf-ffi` depend on the facade with its default features, and
      # cargo unifies features across one build, so `--workspace
      # --no-default-features` would leave them on and prove nothing.
      - run: cargo test -p tinker-pdf-font --no-default-features
      - run: cargo test -p tinker-pdf --no-default-features
      # `bundled-fonts` changes what a document that embeds no font renders
      # to, so the tests that say "without a face there is nothing to draw"
      # and the ones that draw with the bundled faces both run.
      - run: cargo test -p tinker-pdf --features bundled-fonts

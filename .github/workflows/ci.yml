# tinker-pdf CI.
#
# The build matrix IS a feature: pure Rust means windows-msvc and wasm32 build
# with nothing but rustup — the two targets MuPDF made painful for Tinker.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # This matrix is what proves ruling 4 on the three native targets:
      # `tests/determinism.rs` hashes rendered pages against committed
      # fingerprints, so linux, windows and macos disagreeing is a build
      # failure rather than something nobody notices. The wasm leg is the
      # `wasm-determinism` job below.
      - run: cargo test --workspace
      # `cmap-predefined` off, *run* rather than merely linked: a build
      # without the CJK tables keeps the codespaces and drops the CIDs, and
      # `tinker-pdf-font/tests/predefined_cmaps_absent.rs` is the only place
      # that path is exercised at all.
      #
      # Per package rather than at the workspace root, and this is not a
      # style choice. `tools/` and `tinker-pdf-ffi` depend on the facade with
      # its default features, cargo unifies features across everything in one
      # build, so `--workspace --no-default-features` leaves the feature *on*
      # and passes while proving nothing.
      - run: cargo test -p tinker-pdf-font --no-default-features
      - run: cargo test -p tinker-pdf --no-default-features
      # Two design rules the compiler cannot enforce: a new crate edge
      # compiles perfectly well, and so does a `.sin()` on a pixel path. Plan
      # 00 and ruling 8 say what the graph is; ruling 4 says why the platform
      # libm may not appear where the output is pixels.
      - run: cargo run -p xtask -- check

  fuzz-targets:
    # The fuzz crate sits outside the workspace, so `cargo check --workspace`
    # never looks at it and its targets can drift out of sync with the APIs
    # they drive without anything noticing. They did exactly that once: four of
    # the eleven had been calling functions with the wrong arity since the day
    # they were written, and nothing caught it because running them needs
    # nightly and cargo-fuzz.
    #
    # `cargo check` alone needs neither. Running them still does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --manifest-path fuzz/Cargo.toml --all-targets

  fuzz-seeds:
    # A short run over the committed seed corpora, on every push and pull
    # request. It is not here to find anything new — the nightly in
    # `fuzz.yml` does that with a hundredfold the budget. It is here so that
    # a change reintroducing a crash we have already found fails the pull
    # request that makes it, rather than the next scheduled run.
    #
    # That works because a minimised reproducer lands twice: as a test in the
    # crate that owns the parser, and as a seed here. libFuzzer replays the
    # whole corpus before it mutates anything, so the replay alone is the
    # regression check, and the seconds after it are a free look around.
    #
    # Bounded on purpose, and bounded per target rather than in total, so
    # adding a target adds a known amount of time instead of quietly taking
    # it from the others: twenty-two targets, twenty seconds each, one build.
    # Unlike the nightly this is one runner rather than twenty-two, because
    # holding twenty-two machines for twenty seconds each is worse for everyone
    # queueing behind it than holding one for five minutes.
    #
    # `crypt` is the one target for which twenty seconds is not twenty seconds
    # of fuzzing: 7.6.4.3.3's hardened hash is meant to be slow, and the seed
    # replay alone is most of its budget. That is recorded rather than tuned —
    # gap 24 milestone 5 has the arithmetic — and it is why the ciphers
    # underneath the handler are a target of their own.
    #
    # This job replaces nothing: `fuzz-targets` above still type-checks the
    # crate on stable, on every platform's schedule, and it is the check that
    # would notice a target rotting even if nightly or cargo-fuzz were
    # unavailable.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@cargo-fuzz
      - name: Build every target once
        run: cargo fuzz build
        # `-D warnings` from a nightly compiler would fail this on a lint
        # that has nothing to do with the code under test.
        env:
          RUSTFLAGS: ''
      - name: Replay the seed corpora
        run: |
          set -uo pipefail
          failed=()
          for target in $(cargo fuzz list); do
            echo "::group::$target"
            if ! cargo fuzz run "$target" "fuzz/corpus/$target" -- \
                 -max_total_time=20 -timeout=20; then
              failed+=("$target")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -ne 0 ]; then
            echo "::error::fuzz targets crashed: ${failed[*]}"
            exit 1
          fi
        env:
          RUSTFLAGS: ''
      - name: Attach the crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-seed-crashes
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30

  bindings:
    # Excluded from the workspace for the same reason as fuzz/ — they pull
    # dependencies the engine refuses — and so invisible to
    # `cargo check --workspace` for the same reason. A facade change that
    # breaks them would otherwise be found by whoever next tried to publish.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --manifest-path bindings/python/Cargo.toml
      - run: cargo check --manifest-path bindings/js/Cargo.toml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'
      - run: dotnet build bindings/dotnet/TinkerPdf.csproj

  wasm:
    # wasm32-unknown-unknown is a first-class target from day one. The ffi crate
    # (cdylib for native bindings) and the CLI tools are excluded; the engine
    # crates and the facade must always build here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target wasm32-unknown-unknown -p tinker-pdf

  wasm-determinism:
    # The fourth target for ruling 4. `wasm32-unknown-unknown` cannot run a
    # test binary without a JavaScript harness, so the determinism check runs
    # on `wasm32-wasip1` under wasmtime instead: same code generation, same
    # arithmetic, and a plain `main` the runner can execute.
    #
    # If this job disagrees with the native matrix, the fingerprints are not
    # the thing to change — some arithmetic is not target-stable, and that is
    # what this exists to find.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: taiki-e/install-action@wasmtime
      - uses: Swatinem/rust-cache@v2
      # Piped through `tee` so the run can be asserted on afterwards. A job
      # that compiled the test and executed nothing would exit 0 and look
      # exactly like a passing one — `cfg`-ing the tests off this target, or
      # marking them `#[ignore]` because wasm was inconvenient one afternoon,
      # both produce a green tick and prove nothing. `pipefail` because the
      # pipe would otherwise return `tee`'s status and hide a real failure.
      - name: Render on wasm32-wasip1 and compare against the fingerprints
        run: |
          set -o pipefail
          cargo test -p tinker-pdf --test determinism --target wasm32-wasip1 \
            2>&1 | tee determinism.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' determinism.log
          grep -q 'test rendering_is_stable_across_targets \.\.\. ok' \
            determinism.log
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime

  qpdf-linearization:
    # The external arbiter plan 09 names for Annex F. `tests/linearized.rs`
    # checks everything the engine can check about its own output; it cannot
    # check whether the format was understood, and the hint tables are exactly
    # where that mattered — bit-packed structures this repository wrote and
    # nothing here read, wrong in five ways with every test green.
    #
    # Ruling 9: qpdf is invoked, never linked and never vendored, and its
    # output is a transient comparison reference.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y qpdf
      - run: qpdf --version
      # The same shape as `wasm-determinism` above, for the same reason. These
      # tests skip when qpdf is absent, and a skip exits 0 and looks exactly
      # like a pass — so the job reads its own output and fails unless it can
      # see that the oracle ran. `pipefail` because the pipe would otherwise
      # return `tee`'s status and hide a real failure; `--nocapture` because a
      # passing test's stdout is swallowed otherwise and there would be
      # nothing to read.
      - name: Validate linearized output against qpdf
        run: |
          set -o pipefail
          cargo test -p tinker-pdf-cos --test qpdf_oracle -- --nocapture \
            2>&1 | tee qpdf-oracle.log
          # The skip is checked first and on its own, so the reason reaches
          # the log. A bare `grep -q RAN` fails the step too, but under
          # `bash -e` it fails it *silently* — a red tick with nothing saying
          # the oracle never ran is only half of what this job is for.
          if grep -q 'qpdf-oracle: SKIPPED' qpdf-oracle.log; then
            echo "::error::qpdf was not found, so the linearization oracle" \
                 "SKIPPED rather than passed"
            exit 1
          fi
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' qpdf-oracle.log
          grep -q 'qpdf-oracle: RAN' qpdf-oracle.log
      # The two synthesised-container oracles, in the same job because they
      # want the same binary and the same posture. Gap 29 milestone 5 wrote
      # `tests/cbz_qpdf.rs` and gap 30 milestone 4 wrote `tests/xps_qpdf.rs`,
      # and both are exit criteria of the form "saving it produces a file qpdf
      # reads clean" — which is a claim CI has to be able to see. Until this
      # step existed they ran only under `cargo test --workspace`, where a
      # skipped oracle exits 0 and reads exactly like a pass, which is the
      # failure gap 20 built the grep for in the first place.
      - name: Validate synthesised container documents against qpdf
        run: |
          set -o pipefail
          cargo test -p tinker-pdf --test cbz_qpdf --test xps_qpdf -- \
            --nocapture 2>&1 | tee container-oracle.log
          if grep -q 'qpdf-oracle: SKIPPED' container-oracle.log; then
            echo "::error::qpdf was not found, so the CBZ and XPS oracles" \
                 "SKIPPED rather than passed"
            exit 1
          fi
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' container-oracle.log
          grep -q 'qpdf-oracle: RAN' container-oracle.log

  mutool-xps-oracle:
    # Ruling 9's oracle for XPS itself, and gap 30's design section writes the
    # irony down rather than leaving it to be noticed: MuPDF reads XPS, mutool
    # is already one of ruling 9's four named oracles, and so **the library gap
    # 28's decision removes from Tinker's shipped tree is the best available
    # oracle for the format it is being removed for**. Ruling 9 permits exactly
    # that, because an oracle is invoked and never linked.
    #
    # `qpdf-linearization` above reads the PDF this engine wrote and says
    # whether it is a well-formed PDF. It has never seen an XPS. This job reads
    # **both** — the package and the document synthesised from it — so what it
    # compares is two readings of one source by two independent programs, which
    # is the only thing in the repository that can catch a mistake this engine
    # makes consistently in both directions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y mupdf-tools
      # `mutool -v` writes its banner to stderr and exits 0. A `|| true` here
      # would hide a missing binary, which is the whole failure this job exists
      # to prevent.
      - run: mutool -v
      # The same shape as `qpdf-linearization` above, for the reason gap 20
      # learned it: these tests skip when mutool is absent, and a skip exits 0
      # and looks exactly like a pass — so the job reads its own output and
      # fails unless it can see that the oracle ran. Row 9's own words are that
      # the job is **red when the tool is missing**.
      - name: Check the XPS reader against mutool
        run: |
          set -o pipefail
          cargo test -p tinker-pdf --test xps_mutool -- --nocapture \
            2>&1 | tee mutool-oracle.log
          # The skip is checked first and on its own, so the reason reaches the
          # log. A bare `grep -q RAN` fails the step too, but under `bash -e` it
          # fails it *silently* — a red tick with nothing saying the oracle
          # never ran is only half of what this job is for.
          if grep -q 'mutool-oracle: SKIPPED' mutool-oracle.log; then
            echo "::error::mutool was not found, so the XPS oracle SKIPPED" \
                 "rather than passed"
            exit 1
          fi
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' mutool-oracle.log
          grep -q 'mutool-oracle: RAN' mutool-oracle.log

  jpx-oracle:
    # The external arbiter gap 18a names for JPEG 2000, and the only one there
    # is: the repository holds zero JPX bytes, and ISO/IEC 15444-4's
    # conformance codestreams are not redistributable. `opj_compress` produces
    # streams this repository did not encode, across the five progression
    # orders, multiple tiles, multiple layers, explicit precincts, SOP and EPH
    # — every one of them a partition the decoder would otherwise be guessing
    # about.
    #
    # Ruling 9: openjpeg is invoked, never linked and never vendored, and its
    # output is a transient comparison reference.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libopenjp2-tools
      # `-h` is a usage message and exits 1, so this asks for the text rather
      # than the status. A `|| true` here would hide a missing binary, which
      # is the whole failure this job exists to prevent.
      - run: opj_compress -h 2>&1 | grep -q openjp2
      # The same shape as `qpdf-linearization` above, for the same reason gap
      # 20 learned it: these tests skip when openjpeg is absent, and a skip
      # exits 0 and looks exactly like a pass — so the job reads its own
      # output and fails unless it can see that the oracle ran.
      - name: Check the JPEG 2000 decoder against openjpeg
        run: |
          set -o pipefail
          cargo test -p tinker-pdf-filters --test jpx_oracle -- --nocapture \
            2>&1 | tee jpx-oracle.log
          # The skip is checked first and on its own, so the reason reaches
          # the log. A bare `grep -q RAN` fails the step too, but under
          # `bash -e` it fails it *silently* — a red tick with nothing saying
          # the oracle never ran is only half of what this job is for.
          if grep -q 'jpx-oracle: SKIPPED' jpx-oracle.log; then
            echo "::error::openjpeg was not found, so the JPEG 2000 oracle" \
                 "SKIPPED rather than passed"
            exit 1
          fi
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' jpx-oracle.log
          grep -q 'jpx-oracle: RAN' jpx-oracle.log

  epub-corpus:
    # Gap 31 milestone 1's second corpus, and the only one CI has to fetch.
    #
    # The books this job reads **cannot be committed**: Project Gutenberg's
    # carry a trademark licence whose clause 1.E.1 requires the boilerplate
    # wherever a copy is displayed and whose 1.E.4 forbids detaching the terms,
    # and `epub3-samples` is CC-BY-SA 3.0, which `deny.toml`'s "deliberately NO
    # copyleft — not even weak copyleft" rule bars. So they are fetched into
    # `target/`, read, and thrown away with it. Nothing is redistributed.
    #
    # That is exactly why this job greps its own output. Gap 20 found that a
    # skipped oracle exits 0 and reads exactly like a pass, and the risk is
    # doubled here: the corpus is not in the repository, so the tests over it
    # can fail to run for a second reason as well as the first, and both look
    # like a green tick.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the corpus that cannot be committed
        run: sh crates/tinker-pdf/tests/epub/fetch-corpus.sh
      - name: Read the fetched corpus
        env:
          TINKER_EPUB_CORPUS: ${{ github.workspace }}/target/epub-corpus
        run: |
          set -o pipefail
          cargo test -p tinker-pdf --test epub_fetched -- --nocapture \
            2>&1 | tee epub-corpus.log
          # The skip is checked first and on its own, so the reason reaches the
          # log. A bare `grep -q RAN` fails the step too, but under `bash -e` it
          # fails it *silently* — a red tick with nothing saying the corpus
          # never arrived is only half of what this job is for.
          if grep -q 'epub-corpus: SKIPPED' epub-corpus.log; then
            echo "::error::the fetched EPUB corpus was not read, so the" \
                 "censuses SKIPPED rather than passed"
            exit 1
          fi
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' epub-corpus.log
          grep -q 'epub-corpus: RAN' epub-corpus.log
      # epubcheck, on the EPUB itself — and it checks the **input**, not this
      # engine. It is the W3C's conformance checker, and what it gives is
      # exactly one thing: when this engine and a book disagree, epubcheck says
      # whose fault it is. A book it rejects is one this engine is entitled to
      # refuse; a book it accepts and this engine mis-reads is this engine's
      # bug. Ruling 9's posture, unchanged — a subprocess, never linked, its
      # output transient. Pinned to 5.3.0 and fetched from the release rather
      # than from a distribution package, so the verdicts in
      # `tests/epub/EPUBCHECK.tsv` are compared against the same tool that
      # produced them.
      - name: Check the committed corpus against epubcheck
        run: |
          set -o pipefail
          curl -fsSL --retry 3 -o epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          unzip -q epubcheck.zip
          TINKER_EPUBCHECK="$PWD/epubcheck-5.3.0/epubcheck.jar" \
            cargo test -p tinker-pdf --test epub -- --nocapture \
            2>&1 | tee epubcheck.log
          if grep -q 'epubcheck-oracle: SKIPPED' epubcheck.log; then
            echo "::error::epubcheck did not run, so the recorded verdicts" \
                 "SKIPPED rather than passed"
            exit 1
          fi
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' epubcheck.log
          grep -q 'epubcheck-oracle: RAN' epubcheck.log

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check licenses bans sources

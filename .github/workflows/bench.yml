# Wall-clock benchmarks.
#
# Scheduled and dispatchable, never on the path between a push and a review.
# A benchmark that gates a pull request measures the runner it happened to land
# on: GitHub's hosted runners are shared machines, and fifteen runs of one
# revision on 19 September 2026 swung 22.61 % to 88.36 % depending on the
# operation. So this reports rather than gates, and what it holds the numbers
# to is a band measured on that runner rather than a figure guessed for it.
#
# What it is for is the thing the test suite structurally cannot do. Clocks are
# banned from assertions here — `bounds_ledger.rs` bans `Instant::now` from
# itself so that every bound is a property of an input rather than of a machine
# — which means every performance figure in `docs/` has been a one-time
# measurement with a date beside it and nothing to stop it regressing. These
# numbers, kept as artefacts, are what a regression is eventually noticed
# against.
#
# Criterion compares two revisions itself, and that is the useful mode:
#
#   cargo bench -p tinker-pdf -- --save-baseline before
#   cargo bench -p tinker-pdf -- --baseline before
#
# and `--bench <group>` narrows either to one group's file.
name: bench

on:
  schedule:
    # 05:00 UTC on Mondays. After the nightly corpus run, so the two are never
    # competing for a runner, and weekly because nothing here changes daily.
    #
    # **A scheduled run measures the default branch, whatever ref it was
    # written on.** That is `main`, and `main` is hundreds of commits behind
    # `develop`, so the three cron runs of 31 August, 7 and 14 September 2026
    # benchmarked a months-old tree: six operations rather than seven, and
    # `main`'s own copy of this file still carrying the `time:+\[` guard that
    # cannot match. The band below was measured by dispatching this workflow
    # on `develop` instead, which is what `workflow_dispatch` is here for.
    # Whether `main` should be moved to `develop` is a release decision and
    # not this file's to take; until it is taken, read the weekly run as a
    # measurement of `main`.
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      count:
        description: >-
          Count each operation's instructions under cachegrind instead of
          timing it (the `count` job below)
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job a group, each with its own 30 minutes: the benchmark set is one
  # file a group (`crates/tinker-pdf/benches/<group>.rs`, MS-04), and the
  # whole set at tier P's inputs measures for longer than one job may run. A
  # dispatch's wall time is its slowest job, and a relation between two
  # operations is measured inside one group, on one host.
  bench:
    # A schedule has no inputs, so it always times; a dispatch times unless
    # it asked to count.
    if: ${{ !inputs.count }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One group's failure says nothing about another's figures, so every
      # group finishes and keeps its numbers.
      fail-fast: false
      matrix:
        # An entry a group: the group, and how many operations its file
        # defines -- the count its job's guard holds the log to. `cargo xtask
        # baseline` holds each entry to its `[[bench]]`, to its file and to
        # its list in `baseline.json`, so a group added without its entry, or
        # an operation added without its count, fails the build rather than
        # this job.
        include:
          - group: open
            count: 6
          - group: text
            count: 13
          - group: render
            count: 34
          - group: write
            count: 17
          - group: layout
            count: 40
          - group: calibration
            count: 1
          - group: analysis
            count: 8
          - group: encode
            count: 4
          - group: decode
            count: 9
          - group: sign
            count: 3
          - group: fonts
            count: 7
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The CLI-marked operations run `tpdf` as a child, and
      # `benches/support/cli.rs` takes the one beside the bench binary's
      # profile directory, so this checkout's release binary is built first.
      # It shares the release library `cargo bench` builds, so what this adds
      # is `tpdf`'s own crate.
      - name: Build tpdf
        run: cargo build --release -p tpdf

      # `--release` is implied by `cargo bench`, but the profile is worth
      # naming: a debug-profile benchmark measures the absence of inlining.
      - name: Measure
        run: |
          set -o pipefail
          # Which host this landed on. `ubuntu-latest` is a fleet and not a
          # machine, and the fifteen runs of 19 September 2026 that set the
          # band proved it: scored by the geometric mean of their seven
          # operations they fell into two groups with nothing between them,
          # four at 1.00 to 1.16 of the fastest and eleven at 1.30 to 1.36, on
          # one and the same runner image. Nothing in the log said what the
          # difference was, so the log says it now -- the next measurement can
          # attribute the split instead of recording it as noise. One job a
          # group means one host a group, so each job says its own.
          { grep -m1 'model name' /proc/cpuinfo; nproc; } > bench.log || true
          # A cache restored from another group's job could carry that group's
          # estimates, and the check below reads every estimate it finds, so
          # each job starts from none and holds only the group it measured.
          rm -rf target/criterion
          cargo bench -p tinker-pdf --bench ${{ matrix.group }} 2>&1 | tee -a bench.log
          # The same hazard as everywhere else in this repository: a bench
          # target that compiled and measured nothing exits 0. The group's
          # file names `count` operations; if fewer of them reported a time,
          # this job proved nothing about the rest.
          #
          # This guard read `time:+\[` until 5 September 2026, which is `time`
          # followed by one-or-more colons and then a bracket. Criterion prints
          # `time:` and then *three spaces*, so the pattern could not match and
          # this job had never once passed: all three scheduled runs -- 31
          # August, 7 and 14 September 2026 -- printed their six figures and
          # then exited 1 here, because a cron runs the default branch and
          # `main` still carries the old pattern. A guard against a silent
          # pass that fails on every run is worse than none, because it
          # teaches a reader to ignore the job.
          #
          # Counted, rather than one-or-more: the point is that every
          # operation reported, not that the file is not empty. The count was
          # seven, one job's, from 5 September 2026, when the rasteriser got a
          # benchmark that enters it -- the other six do not, which is why the
          # roadmap's vectorisation row had nothing to measure -- until the
          # seven were split into their groups' files; it is each group's own
          # now, read from the matrix entry above.
          test "$(grep -Ec 'time: +\[' bench.log)" -eq ${{ matrix.count }}

      # Criterion compares against a saved baseline and never exits non-zero
      # when it loses -- the only failure path in 0.5.1 is a *missing* baseline
      # directory. So the comparison this repository ratchets on is one it
      # owns, reading criterion's own estimates against a committed figure and
      # a band measured on the machine that recorded it, here for the group
      # this job measured.
      #
      # A machine with no entry is reported and not failed, the way a corpus
      # with no recorded bar is, so this step is useful on a runner nobody has
      # recorded yet.
      #
      # That was true of a machine and not of the *file*. Until 19 September
      # 2026 `crates/tinker-pdf/benches/baseline.json` did not exist, and a
      # baseline that is not there is refused rather than reported -- so this
      # step exited 1 on every dispatch, however well the benchmarks ran, and
      # the sentence above described a leniency nothing could reach. The file
      # is committed now, `ubuntu-latest` is the machine in it, and
      # `cargo xtask baseline` holds its lists and its entry to the group
      # files, their `[[bench]]` entries and the matrix above, so none of
      # them can drift apart again.
      - name: Hold it to the baseline
        run: cargo run -p xtask -- bench-check --machine ubuntu-latest

      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.group }}
          path: |
            bench.log
            target/criterion/
          if-no-files-found: warn
          retention-days: 90

  # Instructions counted rather than time measured (MS-12), on dispatch
  # alone. Each operation's count mode (`benches/support/mod.rs`) runs under
  # cachegrind, the host instruction counter H-16's default admits as dev
  # tooling: it executes the bench and judges no document (ruling 13). A
  # clock-free count is a property of the code and the input, so the figure
  # is one revision's on any host; what it measures is how far two runs of
  # one revision still part, which is the noise a 1 % gate must clear.
  #
  # Each operation is counted at 1 and at 2 iterations, and the second less
  # the first is one iteration's instructions with start-up and the inputs'
  # construction cancelled -- a warm iteration, as criterion's are, since the
  # first one pays what a process pays once. The pair is counted twice, so a
  # job counts the set as often as a gate counting a base and a head would.
  # `calibration` has no count mode: its file is frozen (H-77), and its input
  # and call are `text/text of 100 dense pages`, counted here.
  #
  # One job a group, or a part of one where the group would not fit in a
  # job's 300 minutes: `open-2-of-6` counts every sixth operation of `open`'s
  # list in `baseline.json`, from the second. Under cachegrind most of an
  # operation's time is what its process does besides its iterations --
  # building its inputs, which the counter counts too -- and four operations
  # of `open` and `write` took about two hours each, so a job of either whole
  # group ran out of time before its last operations (`docs/verification.md`).
  # Split so, no part holds two of those four or of the operations the limit
  # cut off. A part that holds no operation fails, and `counted` below fails
  # unless the jobs counted every operation of the set exactly once, so a
  # part missing from this list cannot drop an operation unseen.
  count:
    if: ${{ inputs.count }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        job:
          - open-1-of-6
          - open-2-of-6
          - open-3-of-6
          - open-4-of-6
          - open-5-of-6
          - open-6-of-6
          - text
          - render
          - write-1-of-5
          - write-2-of-5
          - write-3-of-5
          - write-4-of-5
          - write-5-of-5
          - layout
          - analysis
          - encode
          - decode
          - sign
          - fonts
    env:
      JOB: ${{ matrix.job }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install the counter
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          valgrind --version

      # The group a job counts in, the part of its name before the first `-`.
      - name: Group
        run: echo "GROUP=${JOB%%-*}" >> "$GITHUB_ENV"

      # The bench binary in the profile `cargo bench` builds, and the release
      # `tpdf` its CLI operations take from beside it.
      - name: Build
        run: |
          set -o pipefail
          cargo build --release -p tpdf
          cargo bench -p tinker-pdf --bench "$GROUP" --no-run 2>&1 | tee build.log
          grep -oE "target/release/deps/$GROUP-[0-9a-f]+" build.log | head -n 1 > bench-binary
          test -x "$(cat bench-binary)"

      # Every process of a run is counted, `tpdf`'s children with the bench's
      # own, each writing its own log. A run that does not exit 0 or print
      # its `RAN` line, or a process with no count, fails the job: a count
      # of nothing is the silent pass every guard here exists to stop. Each
      # operation's row is written as it is counted, so a job the limit cuts
      # off keeps what it counted.
      - name: Count
        run: |
          python3 -I - <<'EOF'
          import json, os, pathlib, re, subprocess, tempfile, time

          job = os.environ["JOB"]
          group, _, share = job.partition("-")
          part, parts = (int(n) for n in share.split("-of-")) if share else (1, 1)
          binary = pathlib.Path("bench-binary").read_text().strip()
          lists = json.loads(pathlib.Path("crates/tinker-pdf/benches/baseline.json").read_text())
          names = [op["name"] for op in next(g for g in lists["groups"] if g["group"] == group)["operations"]]
          mine = names[part - 1::parts]
          if not mine:
              raise SystemExit(f"{job}: part {part} of {parts} holds none of {group}'s {len(names)} operations")
          refs = re.compile(r"I\s+refs:\s+([\d,]+)")

          def count(name, iterations):
              with tempfile.TemporaryDirectory() as logs:
                  run = subprocess.run(
                      ["valgrind", "--tool=cachegrind", "--cache-sim=no",
                       "--cachegrind-out-file=/dev/null", "--trace-children=yes",
                       f"--log-file={logs}/%p.log", binary],
                      env=dict(os.environ, TINKER_BENCH_COUNT=f"{group}/{name}",
                               TINKER_BENCH_ITERATIONS=str(iterations)),
                      capture_output=True, text=True)
                  if run.returncode != 0 or f"count-mode: RAN {group}/{name} {iterations}" not in run.stdout:
                      raise SystemExit(f"{group}/{name} at {iterations}: exit {run.returncode}\n{run.stdout}{run.stderr}")
                  found = [refs.search(log.read_text()) for log in sorted(pathlib.Path(logs).glob("*.log"))]
                  if not found or not all(found):
                      raise SystemExit(f"{group}/{name} at {iterations}: a process wrote no instruction count")
                  return sum(int(match.group(1).replace(",", "")) for match in found)

          table = pathlib.Path("counts.tsv")
          table.write_text("id\tfirst\tsecond\tspread_percent\tseconds\n")
          started = time.monotonic()
          for name in mine:
              began = time.monotonic()
              per = [count(name, 2) - count(name, 1) for _ in range(2)]
              low, high = min(per), max(per)
              spread = (high - low) / low * 100 if low > 0 else float("inf")
              line = f"{group}/{name}\t{per[0]}\t{per[1]}\t{spread:.4f}\t{time.monotonic() - began:.0f}"
              print(line, flush=True)
              with table.open("a") as rows:
                  rows.write(line + "\n")
          seconds = time.monotonic() - started
          pathlib.Path("job.tsv").write_text(f"job\toperations\tseconds\n{job}\t{len(mine)}\t{seconds:.0f}\n")
          print(f"count-job: {job}, {len(mine)} of {group}'s {len(names)} operations, {seconds:.0f} s")
          EOF

      - name: Keep the counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: count-${{ matrix.job }}
          path: |
            counts.tsv
            job.tsv
            build.log
          if-no-files-found: warn
          retention-days: 90

  # The set, counted: every operation of every group's list in `baseline.json`
  # but the frozen `calibration`'s, each exactly once across the jobs above,
  # in one table, and each job's time for a pair beside how many it counted.
  # It runs when a job failed or was cut off too, and names what went
  # uncounted, counted twice, or counted under a name no list holds.
  counted:
    if: ${{ always() && inputs.count }}
    needs: count
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: count-*
          path: counted

      - name: Every operation counted once
        run: |
          python3 -I - <<'EOF'
          import json, pathlib

          lists = json.loads(pathlib.Path("crates/tinker-pdf/benches/baseline.json").read_text())
          want = [f"{g['group']}/{op['name']}" for g in lists["groups"] if g["group"] != "calibration"
                  for op in g["operations"]]
          rows = [line for table in sorted(pathlib.Path("counted").glob("*/counts.tsv"))
                  for line in table.read_text().splitlines()[1:] if line]
          jobs = [line for table in sorted(pathlib.Path("counted").glob("*/job.tsv"))
                  for line in table.read_text().splitlines()[1:] if line]
          ids = [row.split("\t")[0] for row in rows]
          missing = [op for op in want if op not in ids]
          twice = sorted({op for op in ids if ids.count(op) > 1})
          unknown = sorted({op for op in ids if op not in want})
          order = {op: i for i, op in enumerate(want)}
          rows.sort(key=lambda row: order.get(row.split("\t")[0], len(want)))
          pathlib.Path("counts.tsv").write_text("id\tfirst\tsecond\tspread_percent\tseconds\n"
                                                + "".join(row + "\n" for row in rows))
          pathlib.Path("jobs.tsv").write_text("job\toperations\tseconds\n" + "".join(job + "\n" for job in jobs))
          print("\n".join(jobs))
          print(f"counted-set: {len(set(ids) & set(want))} of {len(want)} operations, {len(jobs)} jobs finished")
          problems = [f"not counted: {op}" for op in missing] + [f"counted twice: {op}" for op in twice] \
              + [f"no list holds: {op}" for op in unknown]
          if problems:
              raise SystemExit("\n".join(problems))
          EOF

      - name: Keep the set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counted-set
          path: |
            counts.tsv
            jobs.tsv
          if-no-files-found: warn
          retention-days: 90

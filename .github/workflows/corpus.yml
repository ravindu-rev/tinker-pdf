name: corpus

# Scheduled, not per pull request. Fetching four upstream corpora is a few
# hundred megabytes and running 4 500 documents one child process at a time is
# minutes, neither of which belongs on the path between a push and a review.
# A regression here is a real regression, but it is one worth learning about
# once a night rather than once a commit.
on:
  schedule:
    # 04:00 UTC. Nothing depends on the hour; it is off the top of the hour so
    # this run does not queue behind everything else scheduled at midnight.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      # Each is empty by default, and each step or job it drives says so and
      # does nothing when it is: the nightly run is the dispatch with none.
      trace:
        description: >-
          A corpus file, as `<corpus>/<path>` with the path as report.json
          names it, run alone with its stages announced and timed (MS-20)
        required: false
        default: ''
      against:
        description: >-
          A revision whose own runner and child run the reported-breakage
          corpus in the three settings beside this one, compared file by file
          with corpus-diff (MS-18)
        required: false
        default: ''
      bands_revision:
        description: >-
          A revision whose own code runs the five corpora with no faces beside
          this one's on one runner, each corpus's largest peak printed beside
          its band (MS-19)
        required: false
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  corpus:
    runs-on: ubuntu-latest
    # The fetch is network-bound and the run is CPU-bound over thousands of
    # files. The default six hours would let a hang burn a runner for an
    # afternoon before anyone noticed; the per-file timeout inside `corpus-run`
    # is the real guard, and this is the backstop behind it.
    # Raised from 60 on 5 September 2026: the production corpus adds a
    # thousand real-world documents whose median is 288 KB against a fixture
    # suite's few kilobytes, and it is measured at roughly the same wall clock
    # as the other four corpora put together.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `corpus-run` spawns `tpdf probe`, one process per file, and finds it as
      # a sibling of its own executable rather than on PATH — so that the child
      # is provably the same revision and the same profile as the runner. Both
      # must therefore be built, and built the same way. This is not a
      # convenience: a corpus measured against whatever `tpdf` happened to be
      # installed is worse than no measurement.
      - name: Build the runner and the child it spawns
        run: cargo build --release -p xtask -p tpdf

      # `corpus/README.md` has claimed since it was written that "CI restores
      # from a cache keyed on that file", and until 5 September 2026 there was
      # no such step: every nightly refetched every archive. That was 266 MB a
      # night and is 1.53 GB now that the production corpus is pinned, so the
      # claim is made true rather than deleted.
      #
      # A stale or poisoned cache cannot do any harm here, and the reason is
      # the lock rather than the cache: `corpus-fetch` hashes every archive it
      # finds and refuses -- and deletes -- one whose sha256 is not the pinned
      # one, before anything is extracted. So this is a speed-up over a
      # correctness property that already holds, which is the only kind of
      # cache worth having on a verification job.
      - name: Restore the fetched corpora
        uses: actions/cache@v4
        with:
          path: corpus/cache
          key: corpora-${{ hashFiles('corpus/corpora.lock') }}

      # Every check after this one carries the same `if:`. A step with none
      # runs only while every step before it succeeded, so a red census used
      # to skip all three bars, and a red bar the bars after it: a run
      # measured only as far as its first failure. Each check now runs
      # whatever the check before it returned, so long as the corpora are
      # there to read, and a cancelled run still stops. `cargo xtask
      # corpusjob` holds the rule (MS-11.4).
      - name: Fetch the pinned corpora
        id: fetch
        run: cargo run --release -p xtask -- corpus-fetch

      # **One file, alone, with its stages timed** (MS-20). A file that stalls
      # in the bars is killed having written nothing for half its budget, and
      # its record says only the phase it was in. Traced, its child runs pages
      # one and two with `--stages`, each stage of a render announced and the
      # draw stopped at 300 s with the counts it reached, under 900 s for the
      # file, and the runner prints every line it wrote and, on Linux, the CPU
      # time it had used when it was killed, which tells a loop from a wait.
      # The trace prints what the engine read of the file, never its bytes.
      - name: Trace the file the dispatch names
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env:
          TRACE: ${{ inputs.trace }}
        run: |
          if [ -z "$TRACE" ]; then
            echo "trace: none was asked"
            exit 0
          fi
          cargo run --release -p xtask -- corpus-run --trace "$TRACE" --timeout 900

      # The corpus is not only a never-crash bar. Some of it is *ground truth*:
      # the pdf.js JBIG2 fixtures code one picture a dozen ways, so the
      # encodings that do not refine adjudicate the ones that do, and clause
      # 6.3's two context templates and 6.3.5.6's TPGRON slot are held to
      # nothing else in this repository. Those assertions are `#[ignore]` so
      # that `cargo test` stays independent of fetched data — which means this
      # is the only place they run, and without this step they would be
      # documentation rather than a gate.
      - name: Hold the fixtures the corpus adjudicates
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: |
          cargo test --release --no-fail-fast -p tinker-pdf \
            --test jbig2_refinement --test jbig2_lineages \
            -- --ignored --nocapture

      # **Every census, and the reason it is every census.** These assert
      # counts rather than pixels -- 27 signatures across 24 files, 3 313 CFF
      # faces, 2 495 files claiming a PDF/A part -- recorded against the
      # corpora `corpus/corpora.lock` pins, so a reader that stopped finding
      # one of them would otherwise pass every test in the tree.
      #
      # Four of the thirteen ran here until 6 September 2026 and nine did not,
      # and the nine drifted: `pdfa_flavour` was eight files out and
      # `certificates` two, against corpora whose pins had not moved. A census
      # nobody runs is a sentence in a file, which is the thing this
      # repository keeps catching itself doing. `--no-fail-fast` so one stale
      # number does not hide the next.
      #
      # **And a census that read nothing fails it, by name** (MS-13). Each
      # prints a banner of its own name, `pdfa-ledger: RAN ...`, and with
      # `TINKER_CORPUS_REQUIRED` set refuses to skip, so a corpus that is not
      # where a census looks fails that census rather than passing it over;
      # and the step greps every banner, so a census that ran no test at all
      # fails here. The rule `ci.yml`'s `epub-corpus` job holds
      # `epub_fetched.rs` to. `streaming_open.rs`'s three corpus tests are not
      # ignored, so they run by name in a command of their own.
      - name: Hold every corpus census
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env:
          TINKER_CORPUS_REQUIRED: '1'
        run: |
          set +e
          cargo test --release --no-fail-fast -p tinker-pdf \
            --test annotation_census \
            --test certificates \
            --test cff_subset_census \
            --test cmap_census \
            --test cms_census \
            --test default_space_census \
            --test icc_census \
            --test jbig2_attribution \
            --test jbig2_census \
            --test jpeg_census \
            --test jpx_attribution \
            --test pdfa_flavour \
            --test pdfa_ledger \
            --test pdfua \
            --test pdfx_census \
            --test reading_order_census \
            --test signatures \
            --test table_census \
            --test tagged_corpus \
            --test verdicts \
            -- --ignored --nocapture 2>&1 | tee census.log
          censuses=${PIPESTATUS[0]}
          cargo test --release -p tinker-pdf --test streaming_open -- --nocapture --exact \
            linearized_files_from_the_qpdf_corpus_render_page_one_from_their_heads \
            linearized_corpus_files_reach_page_two_without_their_main_tables \
            authenticating_reopens_the_hint_tables_a_sealed_document_refused \
            2>&1 | tee -a census.log
          streaming=${PIPESTATUS[0]}
          set -e
          missing=0
          for banner in annotation-census certificates cff-subset-census rewrite-subset-census \
              cmap-census cms-census default-space-census icc-census icc-reality lut-census \
              lut-reality jbig2-attribution jbig2-census jpeg-census jpx-attribution \
              pdfa-flavour pdfa-ledger pdfua-census pdfx-census reading-order-census \
              signatures streaming-open table-census structure-census verdicts; do
            if ! grep -q "$banner: RAN" census.log; then
              echo "::error::the $banner census printed no '$banner: RAN' banner, so it read nothing"
              missing=1
            fi
          done
          if [ "$censuses" != 0 ] || [ "$streaming" != 0 ] || [ "$missing" != 0 ]; then
            exit 1
          fi

      # `--check` compares against the committed bar and fails on a regression.
      # It refuses outright if the run is incomplete, so a fetch that quietly
      # returned three corpora out of four cannot be read as an improvement.
      #
      # The bar in `corpus/ratchet.json` was recorded WITHOUT font faces, and
      # `corpus-run` refuses to compare a `--fonts` run against it. Adding
      # faces here therefore needs a re-recorded bar in the same commit, which
      # is the point: the two numbers answer different questions and mixing
      # them silently would make the ratchet meaningless.
      - name: Run the corpus and hold the bar
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: |
          set -o pipefail
          # No `--timeout`: the default is sixty seconds, raised from twenty
          # on 5 September 2026 by the commit that deleted the metamorphic
          # budget gate. That commit measured the change and argued it -- and
          # then this workflow went on passing `--timeout 20` on all three
          # runs, so the raise had never once taken effect where it was for.
          # An override that silently contradicts a defaulted decision is
          # worse than no default, so the flag is gone rather than updated:
          # the number lives in `RunArgs::default` with its reasoning beside
          # it, and this file cannot drift from it again.
          cargo run --release -p xtask -- corpus-run \
            --dpi 72 --report corpus/report.json --check \
            2>&1 | tee corpus-run.log

          # A corpus job whose corpora are missing exits 0 having measured
          # nothing, which reads exactly like a clean run. The same hazard the
          # wasm-determinism and the retired qpdf job were fixed for: check
          # the bad outcome first and by name, so the log says why.
          if grep -q 'INCOMPLETE' corpus-run.log; then
            echo "::error::the corpus run did not describe the whole corpus," \
                 "so it proves nothing about a regression"
            exit 1
          fi
          # And prove positively that files were seen, rather than trusting an
          # exit status that a zero-file run would also produce.
          grep -Eq '^all +[1-9][0-9]* files' corpus-run.log
          # The same for ruling 13's axis. A child that skipped the strict pass
          # — an older `tpdf`, a build where it was cfg'd out — would leave
          # every file "not eligible", which reads as a run that measured
          # nothing rather than as a regression.
          grep -Eq '^strict +[1-9][0-9]* rewritten' corpus-run.log
          # And the time axis (MS-07): a child that wrote no spans leaves
          # every time figure empty, which reads as a run with no time to hold
          # rather than as one that measured none.
          grep -Eq '^time +[1-9][0-9]* pages timed' corpus-run.log

      # The second bar, a second step that runs whatever the first returned
      # (the `if:` every check after the fetch carries): one failing must not
      # stop the other from being measured, and the two answer different
      # questions.
      #
      # `--fonts synthetic` writes the face `cargo xtask synth-face` writes —
      # every glyph from 32 up a filled box — and measures against it. No
      # licence, no fetch, no dependence on what faces this runner image
      # happens to ship. It answers "was a face available" and nothing else:
      # the shapes are wrong, and the difference between the two bars is how
      # much of the degradation was the absence of a face rather than a defect
      # in the engine.
      - name: Run the corpus with a face, and hold that bar too
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo run --release -p xtask -- corpus-run \
            --dpi 72 --fonts synthetic \
            --report corpus/report-fonts.json --check \
            2>&1 | tee corpus-fonts.log

          if grep -q 'INCOMPLETE' corpus-fonts.log; then
            echo "::error::the with-faces corpus run did not describe the" \
                 "whole corpus, so it proves nothing about a regression"
            exit 1
          fi
          grep -Eq '^all +[1-9][0-9]* files' corpus-fonts.log
          grep -Eq '^time +[1-9][0-9]* pages timed' corpus-fonts.log
          # And prove the face actually reached the child. A `--fonts` run
          # whose provider silently loaded nothing would look exactly like a
          # no-faces run measured against the wrong bar.
          grep -q 'wrote the synthetic face' corpus-fonts.log

      # The third bar: the faces this project ships, rather than one it
      # synthesises. `tpdf` is rebuilt with the feature, because the child's
      # own `cfg` is what decides — `corpus-run` refuses a run whose `--fonts`
      # setting and whose child's build disagree, in either direction, so a
      # bundled binary cannot quietly record the no-faces bar and a plain one
      # cannot be passed off as this.
      - name: Rebuild the child with the faces this project ships
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: cargo build --release -p tpdf --features bundled-fonts

      - name: Run the corpus with the bundled faces, and hold that bar too
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo run --release -p xtask -- corpus-run \
            --dpi 72 --fonts bundled \
            --report corpus/report-bundled.json --check \
            2>&1 | tee corpus-bundled.log

          if grep -q 'INCOMPLETE' corpus-bundled.log; then
            echo "::error::the bundled-faces corpus run did not describe the" \
                 "whole corpus, so it proves nothing about a regression"
            exit 1
          fi
          grep -Eq '^all +[1-9][0-9]* files' corpus-bundled.log
          grep -Eq '^time +[1-9][0-9]* pages timed' corpus-bundled.log

      # **Which file a relation lost** (MS-18). A bar holds counts and no
      # names, so a relation one file short says it is short and not which
      # file. Given a revision, its own runner and child -- the head's runner
      # refuses an older child's records by their version -- run the
      # reported-breakage corpus in the three settings, over the corpora this
      # job fetched, and corpus-diff compares each report with the head's,
      # file by file. Each file that went from held to broken on `dpi` is
      # printed object by object, dictionaries without stream data, with its
      # probe. The revision is taken through `env`, never interpolated into
      # the script.
      - name: Compare the reported-breakage corpus with the revision the dispatch names
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env:
          AGAINST: ${{ inputs.against }}
        run: |
          if [ -z "$AGAINST" ]; then
            echo "corpus-diff: no revision was asked, so nothing was compared"
            exit 0
          fi
          set -o pipefail
          git fetch --no-tags --depth 1 origin "$AGAINST"
          git worktree add --detach against FETCH_HEAD
          mkdir -p against/corpus corpus/against
          ln -s "$GITHUB_WORKSPACE/corpus/files" against/corpus/files
          (cd against && cargo build --release -p xtask -p tpdf)
          run_against() {
            (cd against && ./target/release/xtask corpus-run --corpus pdfjs --dpi 72 "$@") \
              2>&1 | tee -a corpus/against/runs.log
          }
          run_against --report "$GITHUB_WORKSPACE/corpus/against/report.json"
          run_against --fonts synthetic --report "$GITHUB_WORKSPACE/corpus/against/report-fonts.json"
          (cd against && cargo build --release -p tpdf --features bundled-fonts)
          run_against --fonts bundled --report "$GITHUB_WORKSPACE/corpus/against/report-bundled.json"
          for report in report.json report-fonts.json report-bundled.json; do
            ./target/release/xtask corpus-diff "corpus/against/$report" "corpus/$report"
            ./target/release/xtask corpus-diff "corpus/against/$report" "corpus/$report" \
                --held-to-broke dpi > corpus/against/moved.tsv
            while IFS=$'\t' read -r corpus name file; do
              echo "::group::$report: $corpus/$name, held at the revision, broken on dpi here"
              ./target/release/tpdf objects "$file"
              for number in $(./target/release/tpdf objects "$file" \
                  | awk '$1 ~ /^[0-9]+$/ && $3 != "free" { print $1 }'); do
                ./target/release/tpdf objects "$file" --object "$number"
              done
              ./target/release/tpdf probe "$file" --dpi 72 --no-annotations
              echo "::endgroup::"
            done < corpus/against/moved.tsv
          done

      # Kept whatever the outcome: when the bar moves, the per-file record is
      # the only thing that says which files moved and why.
      - name: Keep the per-file report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-report
          path: |
            corpus/report.json
            corpus/report-fonts.json
            corpus/report-bundled.json
            corpus/against/
          if-no-files-found: warn
          retention-days: 14

  # **The peak bands' own code, on the runner that holds them** (MS-19). A
  # bar's largest peak moved past its band, and nothing said whether the band
  # was ever this runner's figure. Given the revision that last wrote the
  # bars' peaks, this job builds its runner and child beside the head's on one
  # machine, fetches the corpora once and links them into both trees, runs
  # each tree's own corpus-run over the five corpora with no faces, one after
  # the other, and prints each corpus's largest peak in both reports beside
  # its committed band. A job of its own, because the corpus job runs about
  # eighty of its hundred and twenty minutes, and one machine for both runs,
  # so what differs between them is the code. It prints and decides nothing.
  bands:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.bands_revision != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.bands_revision }}
          path: bands
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the head's runner and child
        run: cargo build --release -p xtask -p tpdf

      - name: Build the revision's runner and child
        working-directory: bands
        run: cargo build --release -p xtask -p tpdf

      - name: Restore the fetched corpora
        uses: actions/cache@v4
        with:
          path: corpus/cache
          key: corpora-${{ hashFiles('corpus/corpora.lock') }}

      - name: Fetch the pinned corpora
        id: fetch
        run: cargo run --release -p xtask -- corpus-fetch

      - name: Run the head's corpus with no faces
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: cargo run --release -p xtask -- corpus-run --dpi 72 --report corpus/peaks-head.json

      - name: Run the revision's corpus with no faces
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: |
          mkdir -p bands/corpus
          ln -sfn "$GITHUB_WORKSPACE/corpus/files" bands/corpus/files
          cd bands
          ./target/release/xtask corpus-run --dpi 72 \
            --report "$GITHUB_WORKSPACE/corpus/peaks-revision.json"

      - name: Print each corpus's largest peak beside its band
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: |
          cargo run --release -p xtask -- corpus-peaks \
            corpus/peaks-head.json corpus/peaks-revision.json

      - name: Keep both reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-peaks
          path: |
            corpus/peaks-head.json
            corpus/peaks-revision.json
          if-no-files-found: warn
          retention-days: 14

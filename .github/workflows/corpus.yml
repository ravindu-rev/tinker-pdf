name: corpus

# Scheduled, not per pull request. Fetching four upstream corpora is a few
# hundred megabytes and running 4 500 documents one child process at a time is
# minutes, neither of which belongs on the path between a push and a review.
# A regression here is a real regression, but it is one worth learning about
# once a night rather than once a commit.
on:
  schedule:
    # 04:00 UTC. Nothing depends on the hour; it is off the top of the hour so
    # this run does not queue behind everything else scheduled at midnight.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  corpus:
    runs-on: ubuntu-latest
    # The fetch is network-bound and the run is CPU-bound over thousands of
    # files. The default six hours would let a hang burn a runner for an
    # afternoon before anyone noticed; the per-file timeout inside `corpus-run`
    # is the real guard, and this is the backstop behind it.
    # Raised from 60 on 5 September 2026: the production corpus adds a
    # thousand real-world documents whose median is 288 KB against a fixture
    # suite's few kilobytes, and it is measured at roughly the same wall clock
    # as the other four corpora put together.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `corpus-run` spawns `tpdf probe`, one process per file, and finds it as
      # a sibling of its own executable rather than on PATH — so that the child
      # is provably the same revision and the same profile as the runner. Both
      # must therefore be built, and built the same way. This is not a
      # convenience: a corpus measured against whatever `tpdf` happened to be
      # installed is worse than no measurement.
      - name: Build the runner and the child it spawns
        run: cargo build --release -p xtask -p tpdf

      # `corpus/README.md` has claimed since it was written that "CI restores
      # from a cache keyed on that file", and until 5 September 2026 there was
      # no such step: every nightly refetched every archive. That was 266 MB a
      # night and is 1.53 GB now that the production corpus is pinned, so the
      # claim is made true rather than deleted.
      #
      # A stale or poisoned cache cannot do any harm here, and the reason is
      # the lock rather than the cache: `corpus-fetch` hashes every archive it
      # finds and refuses -- and deletes -- one whose sha256 is not the pinned
      # one, before anything is extracted. So this is a speed-up over a
      # correctness property that already holds, which is the only kind of
      # cache worth having on a verification job.
      - name: Restore the fetched corpora
        uses: actions/cache@v4
        with:
          path: corpus/cache
          key: corpora-${{ hashFiles('corpus/corpora.lock') }}

      - name: Fetch the pinned corpora
        run: cargo run --release -p xtask -- corpus-fetch

      # The corpus is not only a never-crash bar. Some of it is *ground truth*:
      # the pdf.js JBIG2 fixtures code one picture a dozen ways, so the
      # encodings that do not refine adjudicate the ones that do, and clause
      # 6.3's two context templates and 6.3.5.6's TPGRON slot are held to
      # nothing else in this repository. Those assertions are `#[ignore]` so
      # that `cargo test` stays independent of fetched data — which means this
      # is the only place they run, and without this step they would be
      # documentation rather than a gate.
      - name: Hold the fixtures the corpus adjudicates
        run: |
          cargo test --release --no-fail-fast -p tinker-pdf \
            --test jbig2_refinement --test jbig2_lineages \
            -- --ignored --nocapture

      # **Every census, and the reason it is every census.** These assert
      # counts rather than pixels -- 27 signatures across 24 files, 3 313 CFF
      # faces, 2 495 files claiming a PDF/A part -- recorded against the
      # corpora `corpus/corpora.lock` pins, so a reader that stopped finding
      # one of them would otherwise pass every test in the tree.
      #
      # Four of the thirteen ran here until 6 September 2026 and nine did not,
      # and the nine drifted: `pdfa_flavour` was eight files out and
      # `certificates` two, against corpora whose pins had not moved. A census
      # nobody runs is a sentence in a file, which is the thing this
      # repository keeps catching itself doing. `--no-fail-fast` so one stale
      # number does not hide the next.
      - name: Hold every corpus census
        run: |
          cargo test --release --no-fail-fast -p tinker-pdf \
            --test certificates \
            --test cff_subset_census \
            --test cms_census \
            --test icc_census \
            --test jbig2_attribution \
            --test jbig2_census \
            --test pdfa_flavour \
            --test pdfa_ledger \
            --test pdfua \
            --test signatures \
            --test streaming_open \
            --test tagged_corpus \
            --test verdicts \
            -- --ignored --nocapture

      # `--check` compares against the committed bar and fails on a regression.
      # It refuses outright if the run is incomplete, so a fetch that quietly
      # returned three corpora out of four cannot be read as an improvement.
      #
      # The bar in `corpus/ratchet.json` was recorded WITHOUT font faces, and
      # `corpus-run` refuses to compare a `--fonts` run against it. Adding
      # faces here therefore needs a re-recorded bar in the same commit, which
      # is the point: the two numbers answer different questions and mixing
      # them silently would make the ratchet meaningless.
      - name: Run the corpus and hold the bar
        run: |
          set -o pipefail
          # No `--timeout`: the default is sixty seconds, raised from twenty
          # on 5 September 2026 by the commit that deleted the metamorphic
          # budget gate. That commit measured the change and argued it -- and
          # then this workflow went on passing `--timeout 20` on all three
          # runs, so the raise had never once taken effect where it was for.
          # An override that silently contradicts a defaulted decision is
          # worse than no default, so the flag is gone rather than updated:
          # the number lives in `RunArgs::default` with its reasoning beside
          # it, and this file cannot drift from it again.
          cargo run --release -p xtask -- corpus-run \
            --dpi 72 --report corpus/report.json --check \
            2>&1 | tee corpus-run.log

          # A corpus job whose corpora are missing exits 0 having measured
          # nothing, which reads exactly like a clean run. The same hazard the
          # wasm-determinism and the retired qpdf job were fixed for: check
          # the bad outcome first and by name, so the log says why.
          if grep -q 'INCOMPLETE' corpus-run.log; then
            echo "::error::the corpus run did not describe the whole corpus," \
                 "so it proves nothing about a regression"
            exit 1
          fi
          # And prove positively that files were seen, rather than trusting an
          # exit status that a zero-file run would also produce.
          grep -Eq '^all +[1-9][0-9]* files' corpus-run.log
          # The same for ruling 13's axis. A child that skipped the strict pass
          # — an older `tpdf`, a build where it was cfg'd out — would leave
          # every file "not eligible", which reads as a run that measured
          # nothing rather than as a regression.
          grep -Eq '^strict +[1-9][0-9]* rewritten' corpus-run.log

      # The second bar, and a second job rather than a second step: one
      # failing must not stop the other from being measured, and the two
      # answer different questions.
      #
      # `--fonts synthetic` writes the face `cargo xtask synth-face` writes —
      # every glyph from 32 up a filled box — and measures against it. No
      # licence, no fetch, no dependence on what faces this runner image
      # happens to ship. It answers "was a face available" and nothing else:
      # the shapes are wrong, and the difference between the two bars is how
      # much of the degradation was the absence of a face rather than a defect
      # in the engine.
      - name: Run the corpus with a face, and hold that bar too
        run: |
          set -o pipefail
          cargo run --release -p xtask -- corpus-run \
            --dpi 72 --fonts synthetic \
            --report corpus/report-fonts.json --check \
            2>&1 | tee corpus-fonts.log

          if grep -q 'INCOMPLETE' corpus-fonts.log; then
            echo "::error::the with-faces corpus run did not describe the" \
                 "whole corpus, so it proves nothing about a regression"
            exit 1
          fi
          grep -Eq '^all +[1-9][0-9]* files' corpus-fonts.log
          # And prove the face actually reached the child. A `--fonts` run
          # whose provider silently loaded nothing would look exactly like a
          # no-faces run measured against the wrong bar.
          grep -q 'wrote the synthetic face' corpus-fonts.log

      # The third bar: the faces this project ships, rather than one it
      # synthesises. `tpdf` is rebuilt with the feature, because the child's
      # own `cfg` is what decides — `corpus-run` refuses a run whose `--fonts`
      # setting and whose child's build disagree, in either direction, so a
      # bundled binary cannot quietly record the no-faces bar and a plain one
      # cannot be passed off as this.
      - name: Rebuild the child with the faces this project ships
        run: cargo build --release -p tpdf --features bundled-fonts

      - name: Run the corpus with the bundled faces, and hold that bar too
        run: |
          set -o pipefail
          cargo run --release -p xtask -- corpus-run \
            --dpi 72 --fonts bundled \
            --report corpus/report-bundled.json --check \
            2>&1 | tee corpus-bundled.log

          if grep -q 'INCOMPLETE' corpus-bundled.log; then
            echo "::error::the bundled-faces corpus run did not describe the" \
                 "whole corpus, so it proves nothing about a regression"
            exit 1
          fi
          grep -Eq '^all +[1-9][0-9]* files' corpus-bundled.log

      # Kept whatever the outcome: when the bar moves, the per-file record is
      # the only thing that says which files moved and why.
      - name: Keep the per-file report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-report
          path: |
            corpus/report.json
            corpus/report-fonts.json
            corpus/report-bundled.json
          if-no-files-found: warn
          retention-days: 14

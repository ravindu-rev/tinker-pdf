[package]
name = "tpdf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The CLI over the facade: reading commands (info, text, render, objects, ...) and writing ones (merge, split, rotate, encrypt, ...)"
# Never crates.io: a debug CLI for this repository, not a product.
# `cargo xtask check` fails if this line goes missing.
publish = false

[dependencies]
tinker-pdf = { workspace = true }

[features]
# Passed straight through, so `--fonts bundled` has something to mean. `tpdf`
# is what `corpus-run` spawns, and the third corpus bar is measured by building
# this with the feature on.
bundled-fonts = ["tinker-pdf/bundled-fonts"]

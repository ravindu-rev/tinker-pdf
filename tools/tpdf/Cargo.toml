[package]
name = "tpdf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The CLI over the facade: reading commands (info, text, render, objects, ...) and writing ones (merge, split, rotate, encrypt, ...)"
# Never crates.io: a debug CLI for this repository, not a product.
# `cargo xtask check` fails if this line goes missing.
publish = false

[dependencies]
tinker-pdf = { workspace = true }

[features]
# Passed straight through, so `--fonts bundled` has something to mean. `tpdf`
# is what `corpus-run` spawns, and the third corpus bar is measured by building
# this with the feature on.
bundled-fonts = ["tinker-pdf/bundled-fonts"]
# The CJK fallback faces alone, passed through for the benchmark set: the
# render group's CLI operation over a CJK page times this binary as its child,
# so the child carries the faces the set is built with (`docs/verification.md`,
# "The benches"). The faces answer CJK requests only, so no other operation's
# child draws differently.
cjk-fonts = ["tinker-pdf/cjk-fonts"]

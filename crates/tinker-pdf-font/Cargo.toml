[package]
name = "tinker-pdf-font"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Font-program parsing: TrueType/SFNT, CFF/Type2, Type1, CID, CMap, ToUnicode, AFM metrics"
# `exclude = ["data/"]` was here, on the reasoning that Adobe's cmap-resources
# is compiled by build.rs rather than read at run time and so has no business
# in a published crate. The reasoning is half right and the conclusion was
# wrong: build time is *the consumer's* build time. `build.rs` asserts the
# registry is present -- "no CMaps under ... the vendored data is missing" --
# so an excluded `data/` publishes a crate that cannot be built by anybody who
# downloads it, and every crate above it in the graph inherits the failure.
# Measured by moving the directory aside, which reproduces exactly that panic.
#
# So it ships. 8.0 MB of PostScript is 2.4 MB compressed, against crates.io's
# 10 MiB ceiling, and `cargo xtask release` measures it every run rather than
# leaving that margin to be rediscovered.
#
# `target/` would otherwise be swept in by the `data/`-less default on a
# machine that has built here.
exclude = ["target/"]

[features]
default = ["cmap-predefined"]
# The predefined CMaps of 9.7.5.2, compiled from the vendored registry. About
# a megabyte of deflated tables; plan 05 makes it a feature so a wasm host can
# drop it. Identity-H and Identity-V are built in either way, and every other
# registry name still splits its strings correctly from the always-compiled
# codespace table -- it just reports an approximate mapping instead of
# inventing CIDs.
cmap-predefined = []
# The twelve Liberation faces, embedded with `include_bytes!`. Off by default,
# and the default is the interesting half: a host with faces of its own should
# not carry 4.2 MB of ours, and `FontProvider` is the better answer wherever
# one exists. What this adds is an answer for the host that has none — worth
# 52 % of the corpus's reported degradation, measured in
# `corpus/ratchet-fonts.json` against `corpus/ratchet.json`.
#
# No build script: a font program is already the form the rasterizer wants,
# so unlike the CMap registry there is nothing to compile. It turns
# `cjk-fonts` on, so a bundled build carries the CJK faces too
# (`docs/design/fallback-faces.md`, "The feature and the profile").
bundled-fonts = ["cjk-fonts"]
# The CJK fallback faces: Source Han Sans JP, CN, TW and KR Regular, in
# WOFF2, the faces of Adobe-Japan1, Adobe-GB1, Adobe-CNS1, and Adobe-Korea1
# and Adobe-KR. Each is the only data of a crate of its own, because together
# they pass crates.io's package ceiling (ruling 23), and each is decoded once a
# process, through `woff.rs`, on its region's first request. Off by default
# for ruling 19's reason: they are a profile's data, the wasm CJK profile's.
cjk-fonts = [
  "dep:tinker-pdf-font-cjk-jp",
  "dep:tinker-pdf-font-cjk-cn",
  "dep:tinker-pdf-font-cjk-tw",
  "dep:tinker-pdf-font-cjk-kr",
]

[dependencies]
# Inflating the compiled tables. A sibling leaf crate with no dependencies of
# its own, so this is not a third-party dependency and cannot cycle; plan 05's
# "needs the filters phase ... for the bundled-asset pipeline" is this edge.
#
# **Not optional**, and it was until `src/woff.rs` landed. That module is
# `pub mod woff;` with no `cfg` on it and it decompresses table directories
# with `flate_decode` and `brotli_decode`, so the crate does not compile at
# all without this dependency — while `cmap-predefined` is a default feature,
# which hid it from every build that took the defaults. `cargo build -p
# tinker-pdf-shape` did not: the workspace entry for this crate sets
# `default-features = false`, so the shape crate's own `cargo test` failed to
# build until this line lost its `optional`.
tinker-pdf-filters = { workspace = true }
# The CJK faces' bytes, a crate a region, behind `cjk-fonts`. Each holds one
# `static` and depends on nothing, so the edges point down into crates with
# nothing under them (xtask's `ALLOWED`, the fifteenth amendment).
tinker-pdf-font-cjk-jp = { workspace = true, optional = true }
tinker-pdf-font-cjk-cn = { workspace = true, optional = true }
tinker-pdf-font-cjk-tw = { workspace = true, optional = true }
tinker-pdf-font-cjk-kr = { workspace = true, optional = true }

[build-dependencies]
# The same crate's deflate encoder, at build time. A build-dependency never
# reaches a released binary, so this one is unconditional: gating it would
# mean `build.rs` could not compile with the feature off.
tinker-pdf-filters = { workspace = true }

[dev-dependencies]
# Exempt tooling, as in `tinker-pdf-cos`: `sfnt.rs`'s font measurement
# readers are held to "arbitrary bytes never panic" as a property.
proptest = "1.11.0"

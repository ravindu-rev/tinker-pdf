[package]
name = "tinker-pdf-content"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Content-stream tokenizer and interpreter; the Device trait seam; the text-extraction device"

# The vendored UCD ships, for the reason `tinker-pdf-layout` records: build
# time is the consumer's build time and `build.rs` panics when `data/` is
# missing. `target/` would otherwise be swept in on a machine that has built
# here.
exclude = ["target/"]

[features]
# Forwarded; see `tinker-pdf-font`.
default = ["cmap-predefined"]
cmap-predefined = ["tinker-pdf-font/cmap-predefined", "tinker-pdf-cos/cmap-predefined"]

[dependencies]
tinker-pdf-cos = { workspace = true }
tinker-pdf-font = { workspace = true }
tinker-pdf-color = { workspace = true }

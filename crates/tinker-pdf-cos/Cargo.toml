[package]
name = "tinker-pdf-cos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "PDF file syntax: lexer, objects, xref (classic, stream, hybrid), object streams, repair scanner, serializers"

[features]
# Forwarded, not owned. See `tinker-pdf-font`, which is where the tables are;
# a feature has to be re-declared at every link of the chain or
# `--no-default-features` at the workspace root turns nothing off further down.
default = ["cmap-predefined"]
cmap-predefined = ["tinker-pdf-font/cmap-predefined"]

[dependencies]
tinker-pdf-filters = { workspace = true }
tinker-pdf-crypto = { workspace = true }
tinker-pdf-font = { workspace = true }
# The public-key security handler (7.6.5) reads a CMS `EnvelopedData` out of
# `/Recipients` to find the seed its file key is derived from. That is a
# security handler, which is this crate's charter, and the envelope is DER,
# which is `tinker-pdf-pki`'s — the same split as `cos -> font`, where reading
# a font *dictionary* is object-model work that needs the leaf's parser.
tinker-pdf-pki = { workspace = true }

[dev-dependencies]
proptest = "1.11.0"

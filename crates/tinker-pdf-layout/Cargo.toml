[package]
name = "tinker-pdf-layout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Layout, hand-rolled: css-box-3's box model with margin collapsing, CSS 2.2's block and inline formatting contexts, css-text-3's white-space processing, UAX #14 line breaking, and fragmentation into pages"

# The vendored hyphenation dictionaries ship, for `tinker-pdf-font`'s reason
# recorded one crate over: build time is *the consumer's* build time, and
# `build.rs` panics when a dictionary the feature compiles is missing, so a
# crate published without `data/` is a crate nobody who downloads it can build
# with the feature. `target/` would otherwise be swept in by the default on a
# machine that has built here.
exclude = ["target/"]

[features]
# The eight vendored hyphenation dictionaries (`data/hyphenation-*`,
# THIRDPARTY.md), compiled by `build.rs` into `hyphenate`'s tables for
# `hyphens: auto` (`docs/design/hyphenation.md`). Off by default: ruling 19
# puts locale data beyond the default wasm profile in an opt-in one, and the
# default build reads no dictionary and carries none.
default = []
hyphenation = []

[dependencies]
# The one internal edge, and the sixth DAG amendment argues it in
# `xtask/src/main.rs`. Layout matches on the **cascade's** computed style
# rather than on a second style type of its own, which is the whole reason gap
# 31 put milestone 6 before milestone 7: *"a layout engine built first has to
# invent its own input representation, and that representation then becomes
# what the cascade must produce -- which is how a cascade acquires shortcuts."*
#
# There is deliberately **no** `tinker-pdf-math` edge, which the plan predicted
# there would be. Nothing here is transcendental; see `limits.rs`'s header and
# the amendment.
tinker-pdf-css = { workspace = true }
# The sixteenth amendment: UAX #14, UAX #29 and the UCD tables both read live
# in a leaf below this one, which `tinker-pdf-cos` breaks a free text
# annotation's lines by too. Re-exported as `uax14`, `grapheme` and `unicode`,
# so this crate's own paths to them are what they were.
tinker-pdf-unicode = { workspace = true }

[dev-dependencies]
# Property tests, the exempt dev tooling CONTRIBUTING rule 1 names: arbitrary
# pattern files and words against `hyphenate`'s reader and walk.
# Its default `fork` and `timeout` features, which no test uses, pull in
# `wait-timeout`, which does not build for wasm32-wasip1; `std` is what
# the tests use.
proptest = { version = "1", default-features = false, features = ["std"] }

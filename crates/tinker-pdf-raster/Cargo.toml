[package]
name = "tinker-pdf-raster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Pure 2D rasterizer: Bezier flattening, analytic-coverage AA fill, stroking, clipping, image sampling, compositing. Zero PDF knowledge"

[dependencies]
tinker-pdf-math = { workspace = true }
# A `/Lab` transparency group composites in Lab (11.4.7), so `canvas.rs` needs
# `srgb_to_lab` and `lab_to_srgb`. A leaf-to-leaf edge, which ruling 8 admits;
# the alternative was a second copy of the two XYZ matrices, which that crate's
# own comment records as having drifted once already.
tinker-pdf-color = { workspace = true }

[package]
name = "tinker-pdf-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The rasterizing Device: content interpretation drawn through the rasterizer"

[features]
# Forwarded; see `tinker-pdf-font`.
default = ["cmap-predefined"]
cmap-predefined = [
  "tinker-pdf-font/cmap-predefined",
  "tinker-pdf-content/cmap-predefined",
]

[dependencies]
tinker-pdf-content = { workspace = true }
tinker-pdf-raster = { workspace = true }
tinker-pdf-font = { workspace = true }
tinker-pdf-color = { workspace = true }

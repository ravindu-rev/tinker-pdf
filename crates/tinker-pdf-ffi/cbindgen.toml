# The header is generated, and committed: a C, Go or Swift caller needs it in
# the tree, and `cargo build` fetches and runs nothing (CONTRIBUTING.md), so it
# is not a build step. Regenerate after any change to an `extern "C"` item:
#
#     cbindgen --config crates/tinker-pdf-ffi/cbindgen.toml \
#         --crate tinker-pdf-ffi --output crates/tinker-pdf-ffi/include/tinker_pdf.h
#
# `the_header_declares_every_export_and_nothing_else` (src/lib.rs) fails when
# an export is missing from it or a declaration names nothing, and CI's
# `bindings` job regenerates it and fails on any difference, which also
# catches a signature that moved under an unchanged name.
language = "C"
include_guard = "TINKER_PDF_H"
autogen_warning = "/* Generated by cbindgen from crates/tinker-pdf-ffi/src. Do not edit; see crates/tinker-pdf-ffi/cbindgen.toml. */"
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "both"
usize_is_size_t = true

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[parse]
parse_deps = false

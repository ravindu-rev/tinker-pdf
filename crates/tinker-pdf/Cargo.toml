[package]
name = "tinker-pdf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "A from-scratch, pure-Rust PDF engine: open, authenticate, extract text, render, write. The facade crate - the only one users depend on"

[features]
# The predefined CMaps of 9.7.5.2, on by default. This is the switch a host
# actually reaches for -- plan 05 makes it a feature so a wasm build that
# supplies its own encoding tables, or renders no CJK, need not carry a
# megabyte of them. `Identity-H` and `Identity-V` work either way.
default = ["cmap-predefined"]
cmap-predefined = [
  "tinker-pdf-font/cmap-predefined",
  "tinker-pdf-cos/cmap-predefined",
  "tinker-pdf-content/cmap-predefined",
  "tinker-pdf-render/cmap-predefined",
]
# The twelve Liberation faces (9.6.2.2's standard 14, less the two symbolic
# ones), embedded rather than read from a directory. Off by default: a host
# with faces of its own supplies them through `FontProvider` and should not
# carry 4.2 MB of ours. When it is on, the bundled set is asked *after* the
# host's provider, so turning it on can only add answers.
bundled-fonts = ["tinker-pdf-font/bundled-fonts"]

[dependencies]
tinker-pdf-cos = { workspace = true }
tinker-pdf-font = { workspace = true }
tinker-pdf-crypto = { workspace = true }
tinker-pdf-content = { workspace = true }
tinker-pdf-render = { workspace = true }
tinker-pdf-raster = { workspace = true }
tinker-pdf-filters = { workspace = true }
tinker-pdf-color = { workspace = true }
tinker-pdf-zip = { workspace = true }
# Gap 30 milestone 3: `src/xps/opc.rs` reads `[Content_Types].xml` and every
# `.rels` part through it, which is what milestone 2's manifest comment said
# would happen here. `xtask dag` already allowed `tinker-pdf -> tinker-pdf-xml`,
# so promoting it from `[dev-dependencies]` changes no graph.
tinker-pdf-xml = { workspace = true }
# Gap 31 milestone 8: `src/epub/read.rs` cascades a content document against the
# committed UA stylesheet through this crate, and `src/epub/paint.rs` reads a
# computed style out of it. Both were `[dev-dependencies]` from milestone 6 so
# that `tests/bounds_ledger.rs` could read the constants; the graph check counts
# a dev-dependency as an edge, so promoting them adds no edge `xtask dag` did
# not already allow and the fifth and sixth amendments already argue.
tinker-pdf-css = { workspace = true }
tinker-pdf-layout = { workspace = true }
tinker-pdf-shape = { workspace = true }
# Signatures milestone 3: `tests/cms_census.rs` reads the CMS blob out of every
# signed document in the fetched corpora and parses it, which is the only way
# to find out what real producers emit rather than what the specification says
# they should. It is a normal dependency rather than a dev one because the
# verdict types of milestone 6 land in this crate and will need the same edge —
# declaring it once, here, with a use behind it today, is what
# `tinker-pdf-pki/Cargo.toml` says about its own edge to `tinker-pdf-crypto`.
tinker-pdf-pki = { workspace = true }

[dev-dependencies]
# The only third-party crate in this workspace's own tree, and it is exempt
# tooling by name in `Cargo.toml`'s header rule and `CONTRIBUTING.md`: it
# measures the engine and is not part of it. `default-features = false` drops
# the HTML reports and their plotting stack, which would pull a dozen crates in
# to draw pictures nobody looks at in a scheduled job; `cargo_bench_support` is
# what makes plain `cargo bench` work without `cargo-criterion` installed.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
tinker-pdf-cos = { workspace = true }
# `tests/xps.rs` recomputes the XPS corpus's committed inventory through this
# reader and compares it against the one .NET's `System.IO.Compression` wrote,
# so the two have to agree about every name, method and size. Already a normal
# dependency above (gap 29), so this adds no edge to the graph `xtask dag`
# checks — only a test target's access to it.
tinker-pdf-zip = { workspace = true }
# A real dependency since gap 30's milestone 3 (above). It stays listed here as
# well because `tests/xml_real_packages.rs` and `tests/bounds_ledger.rs` name it
# directly: both need `tinker-pdf-zip` in the same crate to get at a part at
# all, which is why those tests live here rather than in the leaf — a leaf that
# reaches sideways to test itself is a leaf with an edge it did not need.
tinker-pdf-xml = { workspace = true }
# `tests/bounds_ledger.rs` reads gap 31 milestone 6's eight CSS constants and
# the `limits.rs` they publish themselves in, which needs the crate in this one.
# It is a dev-dependency and not a real one because the facade does not use CSS
# yet: the element tree, the UA stylesheet and the cascade over a content
# document arrive at milestone 8. The graph check counts a dev-dependency as an
# edge, which is why `tinker-pdf-css` is in the facade's row in `ALLOWED`
# already, with the argument for the edge written out beside it.
tinker-pdf-css = { workspace = true }
# And milestone 7's four layout constants, for the same reason and under the
# same rule: the facade does not lay anything out until milestone 8, and the
# graph check counts a dev-dependency as an edge, so the sixth amendment in
# `ALLOWED` carries the argument for this one too.
tinker-pdf-layout = { workspace = true }

# Wall-clock benchmarks, outside the suite on purpose — see the module note in
# `benches/engine.rs`. `harness = false` is criterion's requirement: it brings
# its own `main`, so cargo's `#[bench]` harness must be off.
[[bench]]
name = "engine"
harness = false

<?xml version="1.0" encoding="UTF-8"?>
<!-- §11's painting properties, each on a shape of its own so a failure names
     the property rather than the file. Every value is one a test can compute:
     `red` is the colour table's, `#0f0` is the three-digit hex expansion, and
     every number is exact in binary. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <!-- §11.3: fill and its rule, and §11.6's fill-opacity. -->
  <rect id="filled" fill="red" fill-rule="evenodd" fill-opacity="0.5"
        width="10" height="10"/>
  <!-- §11.4: the whole stroke family. `stroke-dasharray: 5` is odd and §11.4
       repeats it, so it is five on and five off. -->
  <rect id="stroked" fill="none" stroke="#0f0" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="bevel" stroke-miterlimit="2"
        stroke-dasharray="5" stroke-dashoffset="2" stroke-opacity="0.25"
        width="10" height="10"/>
  <!-- §11.2's `currentColor`, which is what `color` is for. -->
  <g color="rgb(0, 0, 255)">
    <rect id="current" fill="currentColor" width="10" height="10"/>
  </g>
  <!-- §11.5: laid out and not painted. -->
  <rect id="hidden" visibility="hidden" width="10" height="10"/>
  <!-- §14.5's opacity on a group, flattened into the descendants. The child
       both fills and strokes, which is where the flattening is observable. -->
  <g opacity="0.5">
    <rect id="faded" fill="red" stroke="blue" stroke-width="1"
          fill-opacity="0.5" width="10" height="10"/>
  </g>
  <!-- §13.2's fallback: the server is not there, so the file's own answer
       stands. -->
  <rect id="fallback" fill="url(#nothing) yellow" width="10" height="10"/>
  <!-- A value that is not the property's grammar leaves the inherited one
       standing, which is `css-cascade-5` §5.2 and not a zero. -->
  <g stroke="red" stroke-width="7">
    <rect id="kept" stroke-width="3px3" width="10" height="10"/>
  </g>
  <!-- §11.4: a zero width puts no ink on the page. -->
  <rect id="hairless" stroke="red" stroke-width="0" width="10" height="10"/>
</svg>

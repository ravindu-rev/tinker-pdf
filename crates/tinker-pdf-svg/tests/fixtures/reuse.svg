<?xml version="1.0" encoding="UTF-8"?>
<!-- §5.6's `<use>`, in every shape a real file writes it.

     `#unit` is a one-by-one square at the origin, so every instance below can
     be read off its `Move` alone. `#badge` is a `<symbol>` with a view box, so
     the `<use>`'s `width`/`height` override rule is visible. -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="100" height="100">
  <defs>
    <rect id="unit" width="1" height="1"/>
    <g id="pair">
      <rect x="0" width="1" height="1"/>
      <rect x="5" width="1" height="1"/>
    </g>
    <symbol id="badge" viewBox="0 0 10 10">
      <rect width="10" height="10"/>
    </symbol>
  </defs>

  <!-- §5.6: `x` and `y` are an additional `translate` after the element's own
       transform, so this scales and then moves. -->
  <use xlink:href="#unit" x="7" y="9" transform="scale(2)"/>
  <!-- The referenced content inherits from the `<use>`, not from where it was
       written: `#unit` states no fill and this instance is red. -->
  <use href="#unit" fill="#ff0000"/>
  <!-- One element, two nodes: this is where a scene holds more than the
       document has elements. -->
  <use href="#pair"/>
  <!-- A `<symbol>` instanced at a size the symbol did not choose: the view box
       is ten wide and the instance is twenty, so the scale is two. -->
  <use href="#badge" width="20" height="20"/>
  <!-- A reference to nothing at all. -->
  <use href="#nowhere"/>
  <!-- A reference into another document, which this crate cannot fetch. -->
  <use href="elsewhere.svg#thing"/>
</svg>

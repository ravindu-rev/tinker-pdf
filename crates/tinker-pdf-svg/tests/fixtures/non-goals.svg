<?xml version="1.0" encoding="UTF-8"?>
<!-- Every subsystem this build refuses, one element each, so that the refusal
     list is a file rather than a paragraph. §15 filters, §13.3 patterns,
     §23 foreignObject, §19 SMIL, §18 scripting — and one name SVG does not define at all, which is a
     different fact and gets a different warning. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <filter id="blur"><feGaussianBlur stdDeviation="2"/></filter>
  <!-- A `<mask>` is reached by a `mask` reference and draws nothing where it
       stands, so this one, which nothing names, is silent. -->
  <mask id="fade"/>
  <!-- The `<clipPath>` is here and is NOT a warning: since milestone 4 it is
       reached by a `clip-path` reference and draws nothing where it stands,
       which is `<defs>`'s rule. An element that warned here again would mean
       the walk had started rendering it. -->
  <clipPath id="crop"/>
  <pattern id="tiles"/>
  <foreignObject width="10" height="10"/>
  <animate attributeName="x" from="0" to="10" dur="1s"/>
  <animateTransform attributeName="transform" type="rotate"/>
  <set attributeName="fill" to="blue"/>
  <script>void 0;</script>
  <!-- A `<marker>` is drawn at the vertices that name it and nowhere else,
       so this one, which nothing names, is silent. -->
  <marker id="arrow"/>
  <nonsuch/>
</svg>

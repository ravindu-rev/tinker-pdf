<?xml version="1.0" encoding="UTF-8"?>
<!-- §7.9: a nested `<svg>` establishes a viewport, and the percentages inside
     it are of **that** viewport rather than of the page.

     The outer viewport is 100 by 100 and the inner one is a tenth of it, so
     the rectangle's `width="50%"` is five user units. A build that kept the
     outer viewport would make it fifty — the same shape, ten times too wide,
     which is a picture that looks entirely plausible. This is milestone 1's
     zero-injection row, closed. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <svg id="inner" x="0" y="0" width="10%" height="10%">
    <rect id="tenth" x="0" y="0" width="50%" height="50%"/>
  </svg>
</svg>

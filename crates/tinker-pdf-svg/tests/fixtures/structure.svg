<?xml version="1.0" encoding="UTF-8"?>
<!-- §5.1: the structural elements, nested, with the three names the cascade
     reads out of an attribute list (id, class, style) and both spellings of a
     reference (§5.6's xlink:href and SVG 2's href). -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="120" height="60" viewBox="0 0 120 60">
  <title>Structure</title>
  <desc>Four elements under the root, two of them containers.</desc>
  <defs>
    <g id="reused" class="tool shared" style="fill: red"/>
  </defs>
  <g id="outer" transform="translate(10, 5)">
    <g id="inner" transform="scale(2)"/>
    <use xlink:href="#reused"/>
  </g>
  <use href="#reused"/>
</svg>

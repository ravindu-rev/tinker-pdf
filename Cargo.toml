# tinker-pdf — a from-scratch, pure-Rust PDF engine.
#
# Everything that touches PDF data is hand-rolled in this workspace: parsing,
# filters, crypto, fonts, rasterization. No third-party crates for PDF logic or
# primitives. Dev/build/binding tooling (proptest, criterion, PyO3, wasm-bindgen,
# cargo-fuzz) is exempt from that rule; nothing in the exempt set ships inside
# the engine. See docs/plans/00-architecture.md for the policy and its boundary.

[workspace]
resolver = "2"
members = [
  "crates/tinker-pdf-cos",
  "crates/tinker-pdf-filters",
  "crates/tinker-pdf-zip",
  "crates/tinker-pdf-crypto",
  "crates/tinker-pdf-font",
  "crates/tinker-pdf-color",
  "crates/tinker-pdf-math",
  "crates/tinker-pdf-raster",
  "crates/tinker-pdf-content",
  "crates/tinker-pdf-render",
  "crates/tinker-pdf",
  "crates/tinker-pdf-ffi",
  "tools/pdfcmp",
  "tools/oracle-diff",
  "tools/tpdf",
  "xtask",
]

# The language bindings build with their own tooling — maturin for Python,
# wasm-pack for JavaScript — and pull dependencies the engine itself refuses.
# Excluding them keeps `cargo build` at the workspace root free of both.
exclude = [
  "bindings/python",
  "bindings/js",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ravindu-rev/tinker-pdf"
authors = ["tinker-pdf contributors"]

# `default-features = false` on the four crates that carry a feature, because
# a member writing it for itself is *ignored* unless the workspace entry says
# so too — cargo's rule, and a quiet one: the manifest reads as though the
# feature were off and it is on. Each of the four re-declares
# `default = ["cmap-predefined"]`, so a plain `cargo build` still gets the
# tables and only `--no-default-features` on the facade drops them.
#
# Every entry carries a `version` beside its `path`, and it is not decoration:
# `cargo publish` refuses a crate whose dependency has only a path, because a
# path means nothing to anybody who downloads the result. Cargo builds from the
# path here and resolves the version from the registry there, so the number is
# invisible in this checkout — which is exactly why `cargo xtask check`
# compares all ten against `[workspace.package] version` rather than trusting
# that a release remembered them.
[workspace.dependencies]
tinker-pdf-cos = { path = "crates/tinker-pdf-cos", version = "0.0.1", default-features = false }
tinker-pdf-filters = { path = "crates/tinker-pdf-filters", version = "0.0.1" }
tinker-pdf-zip = { path = "crates/tinker-pdf-zip", version = "0.0.1" }
tinker-pdf-crypto = { path = "crates/tinker-pdf-crypto", version = "0.0.1" }
tinker-pdf-font = { path = "crates/tinker-pdf-font", version = "0.0.1", default-features = false }
tinker-pdf-color = { path = "crates/tinker-pdf-color", version = "0.0.1" }
tinker-pdf-math = { path = "crates/tinker-pdf-math", version = "0.0.1" }
tinker-pdf-raster = { path = "crates/tinker-pdf-raster", version = "0.0.1" }
tinker-pdf-content = { path = "crates/tinker-pdf-content", version = "0.0.1", default-features = false }
tinker-pdf-render = { path = "crates/tinker-pdf-render", version = "0.0.1", default-features = false }
tinker-pdf = { path = "crates/tinker-pdf", version = "0.0.1" }

[profile.release]
lto = "thin"
codegen-units = 1

# Build scripts, optimised. `tinker-pdf-font/build.rs` reads 7.5 MB of vendored
# PostScript and deflates the result with the engine's own encoder; unoptimised
# that is most of a minute on every clean build, and it is a *cost paid by
# everyone* rather than by whoever wrote it. This is the only knob that applies
# to a build script and its dependencies, and the workspace has no proc macros
# for it to affect.
[profile.dev.build-override]
opt-level = 2

[profile.release.build-override]
opt-level = 2

[package]
name = "tinker-pdf-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Python bindings for tinker-pdf"
publish = false

[lib]
name = "tinker_pdf"
crate-type = ["cdylib"]
# No test binary and no doctests: the extension module resolves the Python
# API from the interpreter that loads it, so a test executable linked against
# it has no libpython to take those symbols from, and `cargo test --workspace`
# could not link it on a machine without one. The binding's tests are the
# Python scripts under `tests/`, run against an installed wheel.
test = false
doctest = false
# No rustdoc either: the library is named `tinker_pdf`, the module a Python
# import names, which is the facade's library's name too, and cargo documents
# two libraries of one name to one path, so `cargo doc --workspace` refuses
# both. The binding's reference is its Python API, in `README.md`.
doc = false

[dependencies]
tinker-pdf = { path = "../../crates/tinker-pdf" }
# With abi3 and no interpreter on the machine, PyO3 builds from the abi3
# defaults, so the workspace builds where no Python is installed; on Windows
# it links `python3.dll` without an import library.
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }

# Its own workspace root, which is what the root manifest's `exclude` already
# says in a different way. It has to be stated here as well, because `exclude`
# only tells cargo *this* workspace does not own the package: cargo then keeps
# walking up, and in any checkout nested inside another repository -- a git
# worktree under `.claude/worktrees/`, a vendored copy -- it finds an outer
# manifest that has never heard of this path and refuses to build. The failure
# is `current package believes it's in a workspace when it's not`, and this
# empty table is cargo's own documented remedy for it.
[workspace]

[package]
name = "tinker-pdf-python"
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ravindu-rev/tinker-pdf"
authors = ["tinker-pdf contributors"]
description = "Python bindings for tinker-pdf"
publish = false

[lib]
name = "tinker_pdf"
crate-type = ["cdylib"]

[dependencies]
tinker-pdf = { path = "../../crates/tinker-pdf" }
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py39"] }

# Its own workspace root; see the same table in `bindings/python/Cargo.toml`
# for why `exclude` in the root manifest is not enough on its own.
[workspace]

[package]
name = "tinker-pdf-js"
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ravindu-rev/tinker-pdf"
authors = ["tinker-pdf contributors"]
description = "JavaScript and WebAssembly bindings for tinker-pdf"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Forwarded from the facade, not invented here (ruling 11): a binding adds no
# behaviour of its own, and this is the same switch `tinker-pdf` carries. It
# is declared here because this crate is the one that produces an actual
# `.wasm`, so it is where the size of a decision is measurable -- which is
# what plan 05's "wasm hosts ... can drop both" is about.
default = ["cmap-predefined"]
cmap-predefined = ["tinker-pdf/cmap-predefined"]
# Forwarded for the same reason: it is a footprint profile, and the wasm this
# crate builds is the one whose size `cargo xtask footprint` holds.
bundled-fonts = ["tinker-pdf/bundled-fonts"]
# The CJK profile (ruling 19): the four CJK fallback faces, which a host that
# renders CJK and has no faces of its own takes without the Liberation set.
# `bundled-fonts` carries them too, so this profile is that one less the
# twelve Latin faces, and the default carries neither.
cjk-fonts = ["tinker-pdf/cjk-fonts"]

[dependencies]
tinker-pdf = { path = "../../crates/tinker-pdf", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"

# The root workspace's release profile, which cargo reads from the workspace
# root alone, so this root declares it too: the `.wasm` is built as the C
# ABI is. `cargo xtask profiles` holds this table equal to the root's, key for
# key, so a profile change is made in all three manifests or fails `check`.
[profile.release]
lto = "thin"
codegen-units = 1

[package]
name = "tinker-pdf-js"
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ravindu-rev/tinker-pdf"
authors = ["tinker-pdf contributors"]
description = "JavaScript and WebAssembly bindings for tinker-pdf"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Forwarded from the facade, not invented here (ruling 11): a binding adds no
# behaviour of its own, and this is the same switch `tinker-pdf` carries. It
# is declared here because this crate is the one that produces an actual
# `.wasm`, so it is where the size of a decision is measurable -- which is
# what plan 05's "wasm hosts ... can drop both" is about.
default = ["cmap-predefined"]
cmap-predefined = ["tinker-pdf/cmap-predefined"]

[dependencies]
tinker-pdf = { path = "../../crates/tinker-pdf", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"

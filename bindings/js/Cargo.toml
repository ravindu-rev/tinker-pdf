[package]
name = "tinker-pdf-js"
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ravindu-rev/tinker-pdf"
authors = ["tinker-pdf contributors"]
description = "JavaScript and WebAssembly bindings for tinker-pdf"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tinker-pdf = { path = "../../crates/tinker-pdf" }
wasm-bindgen = "0.2"
js-sys = "0.3"

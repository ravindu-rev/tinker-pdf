# The corpus lock (plan 14, gap 23).
#
# Corpora are FETCHED, never committed. A forge entry pins two things, because
# they answer different questions -- and the one entry that is not a forge
# archive pins one, which its own comment argues where it sits:
#
#   commit  the upstream git object id the archive is of. An upstream that
#           rewrites history or moves a branch cannot change what this names.
#   sha256  the archive's bytes. This is what a fetch verifies against, and
#           what a tampered mirror fails.
#
# A forge's archive of a fixed commit is not guaranteed byte-stable forever --
# its compressor may change -- so when the two disagree the difference says
# which kind of change it was. Re-recording a `sha256` is then a deliberate act
# with its own commit and its own reason, which is what gap 23's risk table
# asks for. `cargo xtask corpus-fetch --record` prints what was actually
# fetched, for preparing exactly that commit.
#
# `licence` is upstream's terms. `redistribute` is this project's posture, and
# it is `no` for every entry regardless of how permissive upstream is: plan 14
# says nothing from any corpus enters git, so a permissive licence changes what
# we *could* do and not what we do.
#
#   cargo xtask corpus-fetch          fetch and verify all of them
#   cargo xtask corpus-licences       print the table corpus/README.md carries
#   cargo xtask corpus-run            run them


# tinker-pdf is MIT OR Apache-2.0 and intends to stay that way. The point of this
# file is to fail CI when a dependency arrives with a license we cannot ship under.
#
# There is deliberately NO copyleft in this list — not even weak copyleft. The
# engine is a library meant to be embeddable anywhere (including the app stores
# that reject (A)GPL), and the hand-rolled policy means the dependency tree is
# tiny dev-tooling anyway. If something copyleft ever seems necessary, that is a
# design smell to fix, not an exception to add.
#
# The list below covers *crates*. It is also the list vendored **data** is
# checked against, which cargo-deny cannot do for itself: it reads the crate
# graph and a directory of text files is not in it. `cargo xtask vendor` closes
# that half — every tree named in THIRDPARTY.md must declare an SPDX identifier
# that appears here, so a data license the project could not ship fails the same
# gate a crate license would. `crates/tinker-pdf-font/data/cmap-resources` is
# BSD-3-Clause and passes on the entry two lines below this one.

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",   # Adobe's cmap-resources, vendored as data (THIRDPARTY.md)
  "ISC",
  "CC0-1.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  # OFL-1.1 for the Liberation family, an asset rather than code. It left this
  # list once, when an audit found it describing faces that did not exist —
  # an allowlist entry for an absent asset reads as evidence the engine ships
  # fonts, which is the exact false impression the real gap turns on. The
  # condition for its return was stated then and is met now: it comes back in
  # the same commit as the faces themselves, the THIRDPARTY.md section and the
  # `bundled-fonts` feature, and not one of the four earlier than the others.
  #
  # What made it worth doing is a measurement rather than an argument.
  # `corpus/ratchet-fonts.json` is the same 4 525 corpus files rendered with a
  # face supplied, and 52 % of all reported degradation was the absence of one.
  # The base 14 are required to be available by 9.6.2.2, so a conforming file
  # naming Helvetica and embedding nothing is one this engine could not draw:
  # a conformance gap rather than only a policy.
  "OFL-1.1",
]

[bans]
multiple-versions = "warn"

# The hand-rolled rule, made enforceable.
#
# The owner's decision was that no third-party crate implements PDF logic or a
# primitive: no inflate, no JPEG, no CCITT, no fonts, no rasterizer, no crypto.
# Until now that rule lived only in prose, so a new dependency that happened to
# be MIT-licensed would have passed every check in this file unnoticed — the
# licence list has nothing to say about *what a crate does*.
#
# The workspace's whole dependency tree is `proptest` and its transitive
# closure, plus the binding and fuzz tooling which lives outside the workspace.
# Anything else arriving in the engine crates is the thing this policy exists
# to prevent, so it is denied by name.
deny = [
  # Compression and image codecs.
  { name = "flate2" },
  { name = "miniz_oxide" },
  { name = "libz-sys" },
  { name = "zlib-rs" },
  { name = "inflate" },
  { name = "deflate" },
  { name = "weezl" },
  { name = "jpeg-decoder" },
  { name = "zune-jpeg" },
  { name = "mozjpeg-sys" },
  { name = "image" },
  { name = "png" },
  { name = "fax" },
  # TIFF, denied in the milestone that writes the reader rather than the one
  # that finishes the plan -- gap 30's rule three sections below, applied where
  # it bites hardest. A TIFF reader is a *directory walk* over six codings this
  # repository already owns, so the crate a hurried author reaches for would
  # bring a second inflate, a second LZW, a second CCITT and a second JPEG in
  # behind it, and rule 1 would be broken four times by one line of Cargo.toml.
  #
  # `image` is denied twelve lines above and is named again here in prose
  # rather than twice in the list, because it is the crate whose TIFF support
  # is the reason somebody would add it. `tiff` is the one `image` itself uses.
  { name = "tiff" },
  { name = "tiff-decoder" },
  # Brotli, and the WOFF containers that are the only reason this engine needs
  # it. Gap 31's Tier 4 writes an RFC 7932 decoder so a book's `@font-face` can
  # name a WOFF2, and these land in the milestone that writes the decoder
  # rather than the one that finishes the plan -- the rule gap 30 wrote for XML
  # and gap 31 repeated for CSS: the milestone that writes the parser is the
  # window in which the temptation exists, and it is a wide window here.
  # `brotli` is MIT/Apache-2.0 and `ttf-parser` (already denied below, for
  # fonts) is MIT, so the licence gate would have waved every one of them
  # through. The **data** is the opposite case and has the opposite answer:
  # RFC 7932's static dictionary is vendored under THIRDPARTY.md and checked
  # against this allowlist by `cargo xtask vendor`, because a table of
  # published values is not an implementation.
  { name = "brotli" },
  { name = "brotli-decompressor" },
  { name = "woff2" },
  { name = "woff2-patched" },
  # Archive containers and checksums. `zip` is the one CONTRIBUTING rule 1
  # would have been most quietly broken by: gap 29 reads comic archives, and
  # reaching for the obvious crate would have added a third-party format
  # implementation to an engine whose entire claim is that it has none. The
  # CRC-32 crates sit here for the same reason at a smaller scale -- it is a
  # sixty-line table-driven routine, and `tinker-pdf-filters` has it because
  # both ZIP entries and PNG chunks need the identical polynomial.
  { name = "zip" },
  { name = "zip-extract" },
  { name = "async_zip" },
  { name = "rc-zip" },
  { name = "rawzip" },
  { name = "tar" },
  { name = "crc32fast" },
  { name = "crc" },
  { name = "crc-any" },
  { name = "crc32c" },
  { name = "adler" },
  { name = "adler2" },
  { name = "adler32" },
  { name = "simd-adler32" },
  # XML. An XML reader is the single most reachable-for dependency in this
  # whole programme -- there are nine good ones, all permissively licensed, and
  # every one of them would have passed every other check in this file. Gap 30
  # writes the parser by hand under CONTRIBUTING rule 1 because three parts of
  # an OPC package are XML and because a reader that *parses* a document type
  # declaration is one refactor away from a reader that resolves an external
  # entity; these names are denied in the milestone that writes the parser
  # rather than the one that finishes the plan, because the milestone that
  # writes the parser is the window in which the temptation exists.
  #
  # `serde` and `serde_derive` are deliberately NOT here, and the omission is
  # recorded so it does not read as an oversight: they are not format
  # implementations, nothing here uses them, and denying a general-purpose crate
  # on the grounds that it is often seen near XML would make this file about
  # taste rather than about rule 1.
  { name = "quick-xml" },
  { name = "roxmltree" },
  { name = "xml-rs" },
  { name = "xmlparser" },
  { name = "serde-xml-rs" },
  { name = "minidom" },
  { name = "sxd-document" },
  { name = "libxml" },
  { name = "rustyxml" },
  # CSS, and the markup readers that come with it. Gap 31's own audit of this
  # file found it denying sixty-six crates and **not one of them a CSS crate,
  # an HTML crate, a layout engine, a line breaker or a Unicode-data crate** --
  # a hole exactly where that plan works. These land in the milestone that
  # writes the parser rather than the one that finishes the plan, which is the
  # rule gap 30 wrote three paragraphs above: the milestone that writes the
  # parser is the window in which the temptation exists, and it is a wider
  # window here than it was for XML. `cssparser` and `selectors` are Servo's,
  # they are excellent, they are MPL-2.0 (which this file's licence allowlist
  # already bars) and `lightningcss` and `simplecss` are not -- so the licence
  # gate would have stopped two of six and waved four through.
  #
  # `html5ever` and its relatives are here for a second reason beyond rule 1:
  # an EPUB content document is XHTML, which is XML, and this engine reads it
  # with `tinker-pdf-xml` under a document-type mode that refuses the internal
  # subset. An HTML5 tree builder is a *different* parser with a different
  # error-recovery model and a different threat surface, and adopting one would
  # quietly undo gap 30's whole defence against entity expansion.
  # SVG, denied in the milestone that writes the parser -- this file's own rule
  # about when the temptation exists. `usvg` and `resvg` are the obvious two and
  # are excellent; `svgtypes` is the path and transform grammars alone, which is
  # exactly the part `tinker-pdf-svg/src/path.rs` transcribes and therefore the
  # most tempting of the four. `librsvg` is GPL and would not clear the licence
  # gate anyway, which is not the reason it is here: the reason is rule 1.
  { name = "usvg" },
  { name = "resvg" },
  { name = "svgtypes" },
  { name = "svgfilters" },
  { name = "librsvg" },
  { name = "nsvg" },
  { name = "svg" },
  { name = "cssparser" },
  { name = "lightningcss" },
  { name = "selectors" },
  { name = "simplecss" },
  { name = "css-color-parser" },
  { name = "stylo" },
  { name = "html5ever" },
  { name = "markup5ever" },
  { name = "scraper" },
  { name = "kuchiki" },
  { name = "kuchikiki" },
  { name = "tl" },
  { name = "lol_html" },
  { name = "html5gum" },
  # Layout engines and line breakers, gap 31 milestone 7. The same audit that
  # found no CSS crate here found no layout engine and no line breaker either,
  # and the window is again the milestone that writes one.
  #
  # `taffy`, `stretch`, `yoga` and `morphorm` are flexbox/grid engines. None of
  # them is a PDF crate and none of them would trip the licence gate --
  # `taffy` is MIT -- which is exactly the hole rule 1 exists to close: the
  # licence list has nothing to say about *what a crate does*.
  { name = "taffy" },
  { name = "stretch" },
  { name = "yoga" },
  { name = "morphorm" },
  # The line breaker and the Unicode-data crates around it. CONTRIBUTING rule 1
  # has no exception for a line breaker, and gap 31's plan names these three by
  # name in the milestone that writes one. The **data** is a different question
  # and has a different answer: the UCD is vendored as data under
  # THIRDPARTY.md, compiled by a build script, and checked against the licence
  # allowlist above by `cargo xtask vendor`. A table of published facts is not
  # an implementation, and taking a crate that both carries the table and
  # implements the algorithm would take the second along with the first.
  #
  # `rustybuzz` is already denied twelve lines below, for fonts. It is named
  # here as well in prose rather than twice in the list, because it is the
  # crate a line breaker's author reaches for next.
  { name = "unicode-linebreak" },
  { name = "xi-unicode" },
  { name = "unicode-segmentation" },
  { name = "unicode-width" },
  { name = "unicode-bidi" },
  { name = "unicode-normalization" },
  { name = "icu_segmenter" },
  { name = "icu_properties" },
  { name = "harfbuzz_rs" },
  # Fonts and text shaping.
  { name = "ttf-parser" },
  { name = "rustybuzz" },
  { name = "font-kit" },
  { name = "fontdb" },
  { name = "ab_glyph" },
  { name = "owned_ttf_parser" },
  { name = "swash" },
  { name = "allsorts" },
  # Rasterization and geometry.
  { name = "tiny-skia" },
  { name = "raqote" },
  { name = "lyon" },
  { name = "kurbo" },
  { name = "euclid" },
  { name = "zeno" },
  # Cryptography.
  { name = "ring" },
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "rustls" },
  { name = "aes" },
  { name = "sha2" },
  { name = "md-5" },
  { name = "rc4" },
  { name = "digest" },
  { name = "rsa" },
  # PDF itself, which would rather defeat the point.
  { name = "lopdf" },
  { name = "pdf" },
  { name = "printpdf" },
  { name = "mupdf" },
  { name = "mupdf-sys" },
  { name = "pdfium-render" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# tinker-pdf is MIT OR Apache-2.0 and intends to stay that way. The point of this
# file is to fail CI when a dependency arrives with a license we cannot ship under.
#
# There is deliberately NO copyleft in this list — not even weak copyleft. The
# engine is a library meant to be embeddable anywhere (including the app stores
# that reject (A)GPL), and the hand-rolled policy means the dependency tree is
# tiny dev-tooling anyway. If something copyleft ever seems necessary, that is a
# design smell to fix, not an exception to add.
#
# The list below covers *crates*. It is also the list vendored **data** is
# checked against, which cargo-deny cannot do for itself: it reads the crate
# graph and a directory of text files is not in it. `cargo xtask vendor` closes
# that half — every tree named in THIRDPARTY.md must declare an SPDX identifier
# that appears here, so a data license the project could not ship fails the same
# gate a crate license would. `crates/tinker-pdf-font/data/cmap-resources` is
# BSD-3-Clause and passes on the entry two lines below this one.

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",   # Adobe's cmap-resources, vendored as data (THIRDPARTY.md)
  "ISC",
  "CC0-1.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  # OFL-1.1 was here, commented "bundled substitute fonts (Liberation family),
  # an asset not code". There are none, and there never have been:
  # `crates/tinker-pdf/tests/substitute_fonts.rs` synthesises its face on the
  # spot precisely so that "the repository carries no font anyone has to
  # licence". An allowlist entry describing an asset that does not exist reads
  # as evidence the engine ships faces, which is the exact false impression the
  # real font-parity blocker turns on — a document naming Helvetica and
  # embedding nothing extracts its text and draws none of it. When plan 05's
  # M10 bundles Liberation, the entry comes back in the same commit as the
  # faces, the THIRDPARTY.md section and the `bundled-fonts` feature.
]

[bans]
multiple-versions = "warn"

# The hand-rolled rule, made enforceable.
#
# The owner's decision was that no third-party crate implements PDF logic or a
# primitive: no inflate, no JPEG, no CCITT, no fonts, no rasterizer, no crypto.
# Until now that rule lived only in prose, so a new dependency that happened to
# be MIT-licensed would have passed every check in this file unnoticed — the
# licence list has nothing to say about *what a crate does*.
#
# The workspace's whole dependency tree is `proptest` and its transitive
# closure, plus the binding and fuzz tooling which lives outside the workspace.
# Anything else arriving in the engine crates is the thing this policy exists
# to prevent, so it is denied by name.
deny = [
  # Compression and image codecs.
  { name = "flate2" },
  { name = "miniz_oxide" },
  { name = "libz-sys" },
  { name = "zlib-rs" },
  { name = "inflate" },
  { name = "deflate" },
  { name = "weezl" },
  { name = "jpeg-decoder" },
  { name = "zune-jpeg" },
  { name = "mozjpeg-sys" },
  { name = "image" },
  { name = "png" },
  { name = "fax" },
  # Archive containers and checksums. `zip` is the one CONTRIBUTING rule 1
  # would have been most quietly broken by: gap 29 reads comic archives, and
  # reaching for the obvious crate would have added a third-party format
  # implementation to an engine whose entire claim is that it has none. The
  # CRC-32 crates sit here for the same reason at a smaller scale -- it is a
  # sixty-line table-driven routine, and `tinker-pdf-filters` has it because
  # both ZIP entries and PNG chunks need the identical polynomial.
  { name = "zip" },
  { name = "zip-extract" },
  { name = "async_zip" },
  { name = "rc-zip" },
  { name = "rawzip" },
  { name = "tar" },
  { name = "crc32fast" },
  { name = "crc" },
  { name = "crc-any" },
  { name = "crc32c" },
  { name = "adler" },
  { name = "adler2" },
  { name = "adler32" },
  { name = "simd-adler32" },
  # Fonts and text shaping.
  { name = "ttf-parser" },
  { name = "rustybuzz" },
  { name = "font-kit" },
  { name = "fontdb" },
  { name = "ab_glyph" },
  { name = "owned_ttf_parser" },
  { name = "swash" },
  { name = "allsorts" },
  # Rasterization and geometry.
  { name = "tiny-skia" },
  { name = "raqote" },
  { name = "lyon" },
  { name = "kurbo" },
  { name = "euclid" },
  { name = "zeno" },
  # Cryptography.
  { name = "ring" },
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "rustls" },
  { name = "aes" },
  { name = "sha2" },
  { name = "md-5" },
  { name = "rc4" },
  { name = "digest" },
  { name = "rsa" },
  # PDF itself, which would rather defeat the point.
  { name = "lopdf" },
  { name = "pdf" },
  { name = "printpdf" },
  { name = "mupdf" },
  { name = "mupdf-sys" },
  { name = "pdfium-render" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

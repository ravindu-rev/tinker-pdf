# The fuzz crate is deliberately outside the workspace: `cargo-fuzz` builds it
# with its own profile and sanitizer flags, and `libfuzzer-sys` pulls in a C++
# runtime that the engine itself refuses. Tooling is exempt from the
# hand-rolled rule; nothing here ships inside the library.
[package]
name = "tinker-pdf-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tinker-pdf = { path = "../crates/tinker-pdf" }
tinker-pdf-cos = { path = "../crates/tinker-pdf-cos" }
tinker-pdf-filters = { path = "../crates/tinker-pdf-filters" }
tinker-pdf-font = { path = "../crates/tinker-pdf-font" }
tinker-pdf-content = { path = "../crates/tinker-pdf-content" }
tinker-pdf-crypto = { path = "../crates/tinker-pdf-crypto" }
tinker-pdf-zip = { path = "../crates/tinker-pdf-zip" }
tinker-pdf-xml = { path = "../crates/tinker-pdf-xml" }
tinker-pdf-css = { path = "../crates/tinker-pdf-css" }
tinker-pdf-layout = { path = "../crates/tinker-pdf-layout" }

# Detaches from the parent workspace so `cargo build` at the root never tries
# to build a libFuzzer target on a stable toolchain.
[workspace]
members = ["."]

[profile.release]
debug = true

[[bin]]
name = "cos_document"
path = "fuzz_targets/cos_document.rs"
test = false
doc = false

